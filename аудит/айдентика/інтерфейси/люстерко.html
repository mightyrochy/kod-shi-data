<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Люстерко · приклад 2 «Пара»</title>
<style>
/* ПАРА. Усе стоїть двома половинами обабіч осі: ліворуч — ти й твої слова, праворуч — відбиття: що люстерко зрозуміло й зібрало.
   Взірці: колти ХІ–ХІІ ст. (двоє обабіч дерева; бліде золото — поле, емаль — малі комірки), літера й негатив Нарбута,
   хатнє дзеркало на шухляді (лице порожнє, все дрібне — в шухляді під ним). */
@font-face{font-family:'Fixel Text';font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/MacPaw/Fixel@514fd02ea7d70668ed3dd09fb2674ba6f70d61ee/fonts/webfonts/FixelText-Regular.woff2) format('woff2')}
@font-face{font-family:'Fixel Text';font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/MacPaw/Fixel@514fd02ea7d70668ed3dd09fb2674ba6f70d61ee/fonts/webfonts/FixelText-SemiBold.woff2) format('woff2')}
@font-face{font-family:'Fixel Display';font-weight:300;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/MacPaw/Fixel@514fd02ea7d70668ed3dd09fb2674ba6f70d61ee/fonts/webfonts/FixelDisplay-Light.woff2) format('woff2')}
@font-face{font-family:'Fixel Display';font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/MacPaw/Fixel@514fd02ea7d70668ed3dd09fb2674ba6f70d61ee/fonts/webfonts/FixelDisplay-SemiBold.woff2) format('woff2')}
:root{
  --sklo:#F1F3F0;  /* скло: лице дзеркала, холодне й порожнє */
  --bile:#FFFFFF;  /* підкладка фото */
  --ink:#17202A;   /* відбиття: слова люстерка */
  --sire:#58626C;  /* підписи */
  --emal:#1D3A66;  /* синя емаль: вона сама — її слова, її дії */
  --sol:#E0C887;   /* солом'яне золото колта: поле шухляди */
  --sol2:#EEE6CB;  /* те саме поле, розбілене: ручка й шухляда з розмовою */
  --ceh:#A6452E;   /* цегляна крихта: «ні», «проти» */
  --zel:#2E5E4B;   /* зелена крихта: «так», «вдягла» */
  --pol:calc((100vw - 44px)/2);
}
*{box-sizing:border-box;margin:0}
html{background:var(--sklo)}
body{font:400 16px/1.42 'Fixel Text','Segoe UI',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;top:0;bottom:0;left:50%;width:1px;background:rgba(23,32,42,.2);z-index:0}  /* вісь */
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
img{display:block}

/* шапка: дві половини названо — «ти» й «люстерко» */
.verkh{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;column-gap:20px;padding:16px 12px 0;font:600 15px/1 'Fixel Display',sans-serif;letter-spacing:.01em}
.verkh .ty{text-align:right;color:var(--emal)}
.verkh a{position:absolute;right:12px;top:15px;font:400 13px/1 'Fixel Text',sans-serif;color:var(--sire);text-decoration:none;padding:2px 0;border-bottom:1px solid currentColor}

#korin{position:relative;z-index:1;padding:20px 12px 200px}
.os{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;position:relative;align-items:start}
.os+.os{margin-top:14px}
.l{text-align:right}.p{text-align:left}
.na-osi{background:var(--sklo);text-align:center;padding:8px 0;margin:0 auto;position:relative}
.naz{font:300 32px/1.06 'Fixel Display',sans-serif;letter-spacing:-.02em;max-width:11em;text-wrap:balance}
.naz.vel{font-size:46px;letter-spacing:-.03em}
.pid{font-size:13px;line-height:1.35;color:var(--sire)}
.vona-kazhe{color:var(--emal)}
.znak{position:absolute;left:50%;top:var(--y,50%);transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--sklo);border:1px solid var(--ink);display:grid;place-items:center;font:600 14px/1 'Fixel Display',sans-serif;z-index:2}
.znak.pyt{border-color:var(--ceh);color:var(--ceh)}
.znak.syn{background:var(--emal);border-color:var(--emal);color:#fff}

/* фото: скло саме нічого не додає — ні рамки, ні тіні */
.foto{display:block;position:relative;background:var(--bile);overflow:hidden;aspect-ratio:2/3;width:100%}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.foto.tlo-rivne img{object-fit:contain}
.foto.male{display:grid;place-items:center}
.foto.male img{width:auto;height:auto;max-width:min(100%,var(--w));max-height:min(100%,var(--h))}
.foto.bezrechi img,.foto.nema-foto img{display:none}
.foto.bezrechi:after,.foto.nema-foto:after,.foto.pusto:after{content:attr(data-nema);position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;font-size:13px;line-height:1.3;color:var(--sire)}
.foto.pusto{background:none;outline:1px dashed rgba(23,32,42,.45);outline-offset:-1px}
.foto.sklo{background:var(--bile)}
.foto.kv{aspect-ratio:1}
.foto.vidbyttja img{transform:scaleX(-1);filter:grayscale(1) blur(1.5px) contrast(.8);opacity:.42;animation:jasn 5s ease-in-out infinite alternate}
.foto.vidbyttja.stalo img{animation:none;opacity:.14}
@keyframes jasn{from{opacity:.16}to{opacity:.5}}
.foto b.mitka{position:absolute;left:0;bottom:0;background:var(--emal);color:#fff;font:600 12px/1 'Fixel Text',sans-serif;padding:5px 8px}

/* дії: емаль — головна; обвід — друга; обидві стоять на осі */
.dii{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px;position:relative}
.kn{min-height:48px;padding:0 24px;background:var(--emal);color:#fff;font-weight:600;display:inline-flex;align-items:center}
.kn.druha{background:var(--sklo);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.kn:active{background:var(--ink);color:#fff}
.pl{min-height:40px;display:inline-flex;align-items:center;font-size:15px;border-bottom:1px solid currentColor;text-decoration:none}
.pl.je{color:var(--emal);font-weight:600;border-bottom-width:2px}
/* вибір: слова двома стовпцями, що туляться до осі; обране — з емалевою коміркою з боку осі */
.plytky{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:20px;margin-top:6px;position:relative}
.plytky .pl{border:0;min-height:44px;font-size:16px;gap:8px}
.plytky .pl:nth-child(odd){justify-content:flex-end;text-align:right}
.plytky .pl:nth-child(even){flex-direction:row-reverse;justify-content:flex-end}
.plytky .pl.je:after{content:'';width:9px;height:9px;background:var(--emal);flex:none}
.plytky .pl u{width:14px;height:14px;flex:none;text-decoration:none}

/* рядки пар: її слова | знак на осі | що зрозуміла */
.rjad{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);column-gap:6px;align-items:start;padding:11px 0;position:relative;font-size:15px;line-height:1.32}
.rjad .l{color:var(--emal)}
.rjad .l.nema{color:var(--sire);font-size:13px}
.rjad i{width:30px;height:22px;display:grid;place-items:center;background:var(--sklo);font:600 14px/1 'Fixel Display',sans-serif;font-style:normal}
.rjad i.pyt{color:var(--ceh)}
.rjad small{display:block;font-size:13px;color:var(--sire);margin-top:2px}
.rjad .tak{display:flex;gap:16px;margin-top:4px;font-weight:400}
.rjad .tak .pl{min-height:36px;font-size:14px}
.rjad.umova .p{background:var(--sol);margin:-6px -12px -6px -4px;padding:6px 12px 6px 6px;font-weight:600}
.rjad.hol{font:600 20px/1.15 'Fixel Display',sans-serif;padding-top:4px}
.rjad.hol .l{font:400 15px/1.32 'Fixel Text',sans-serif;padding-top:3px}

/* барви: два стовпці однакової висоти — її барви й барви образу */
.stovp{display:flex;flex-direction:column;height:300px}
.stovp div{display:flex;align-items:flex-end;padding:6px 8px;font-size:13px;color:#fff;min-height:26px}
.stovp div.sv{color:var(--ink)}
.l .stovp div{justify-content:flex-end}

/* полиця-шухляда під дзеркалом: дрібні речі лежать на солом'яному полі */
.polycja{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--sol);padding:8px;margin:14px -12px 0;position:relative}
.polycja .foto{aspect-ratio:1;background:var(--sol)}
.polycja .foto.tlo-rivne img{mix-blend-mode:multiply}
.polycja .foto.tlo-zhyve{background:var(--bile)}
.polycja.try{grid-template-columns:repeat(3,1fr)}
.polycja figure{position:relative}
.polycja figcaption{font-size:11px;line-height:1.2;margin-top:4px;text-align:center}
.polycja .zm:after,.polycja .sv:after{content:'нове';position:absolute;left:0;top:0;background:var(--emal);color:#fff;font:600 11px/1 'Fixel Text',sans-serif;padding:3px 5px}
.polycja .sv:after{content:'своє';background:var(--zel)}

.spysok{margin-top:6px;background:var(--sklo);position:relative}
.spysok details{border-bottom:1px solid rgba(23,32,42,.16)}
.spysok summary{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:11px 0;list-style:none;cursor:pointer;min-height:48px}
.spysok summary::-webkit-details-marker{display:none}
.spysok summary b{font-weight:600}
.spysok summary span{font-variant-numeric:tabular-nums;white-space:nowrap}
.spysok summary small{grid-column:1/3;font-size:13px;color:var(--sire)}
.spysok details p{font-size:15px;padding:0 0 10px}
.spysok details div{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:14px}
.spysok details .pl{min-height:36px;font-size:14px}
.razom{display:flex;justify-content:space-between;padding:12px 0;font-weight:600;background:var(--sklo);position:relative}

/* зворот дзеркала: збережене — як напис на звороті */
.zvorot{background:var(--sol);aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px;gap:6px}
.zvorot b{font:600 22px/1.05 'Fixel Display',sans-serif;text-wrap:balance}
.zvorot span{font-size:13px}
.zvorot em{font-style:normal;font-size:12px;display:inline-flex;align-items:center;gap:5px;margin-top:6px}
.kom{display:inline-block;width:9px;height:9px;background:var(--emal);flex:none}
.kom.z{background:var(--zel)}.kom.c{background:var(--ceh)}.kom.o{background:none;box-shadow:inset 0 0 0 1px var(--sire)}
.kom.zhyva{animation:blym 1.1s steps(2) infinite}
@keyframes blym{50%{opacity:.25}}
.prychyny{list-style:none;padding:0;margin:6px auto 0;background:var(--sklo);position:relative;max-width:340px}
.prychyny li{display:grid;grid-template-columns:9px 1fr;gap:10px;align-items:baseline;padding:7px 0;font-size:15px}
.kroky{margin-top:16px}
.kroky .rjad{padding:7px 0;font-size:14px}
.kroky .rjad i .kom{margin:0}
.kroky .bude{color:var(--sire)}

/* ручка й шухляда: розмова — один рядок під дзеркалом; тягнеш — уся */
.ruchka{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sol2);border-top:1px solid rgba(23,32,42,.2)}
.ruchka:before{content:'';position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;background:var(--emal)}
.istorija{display:none;background:var(--sol2);padding:22px 16px 6px;max-height:58vh;overflow:auto}
.vidkryta .istorija{display:block}
.istorija p{margin:0 0 14px;font-size:15px;line-height:1.4;max-width:86%}
.istorija p.v{color:var(--emal)}
.istorija p.s{margin-left:auto}
.ostannje{display:block;width:100%;padding:16px 16px 0;font-size:15px;line-height:1.36;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ostannje:empty{display:none}
.vidkryta .ostannje{display:none}
.vvid{display:flex;align-items:center;gap:12px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.vvid span{flex:1;min-height:44px;display:flex;align-items:center;color:rgba(23,32,42,.62);border-bottom:1px solid rgba(23,32,42,.5);font-size:15px;line-height:1.25}
.vvid span.je{color:var(--emal)}
.vvid span.je:after{content:'';width:2px;height:20px;background:var(--emal);margin-left:2px;animation:blym 1s steps(2) infinite}
.mik{width:44px;height:44px;border-radius:50%;background:var(--emal);flex:none;display:grid;place-items:center}
.mik svg{width:18px;height:18px}
.mik.chuje{box-shadow:0 0 0 5px rgba(29,58,102,.25)}
.pult{position:fixed;z-index:9;top:40px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(23,32,42,.88);color:#fff;font:12px/1 system-ui,sans-serif;padding:4px 6px;border-radius:14px;white-space:nowrap}
.pult button{width:28px;height:24px;color:#fff;font-size:16px;text-align:center}.pult b{font-weight:400}.pult a{color:#fff;opacity:.7;margin:0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* широкий екран: шухляда висунута збоку, дзеркало розгорнуте диптихом */
@media (min-width:1000px){
  :root{--sh:400px}
  body{padding-left:var(--sh);font-size:17px}
  body:before{left:calc(var(--sh) + (100vw - var(--sh))/2)}
  .verkh,#korin{max-width:720px;margin:0 auto;padding-left:0;padding-right:0}
  .verkh{padding-top:28px;font-size:17px;column-gap:40px}
  .verkh a{right:0;top:28px}
  #korin{padding-top:28px;padding-bottom:80px}
  .os,.plytky{column-gap:40px}
  .naz{font-size:48px}.naz.vel{font-size:72px}
  .rjad{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);font-size:17px;column-gap:10px}.rjad i{width:40px}
  .rjad.hol{font-size:28px}
  .stovp{height:420px}
  .polycja{margin:20px 0 0;gap:10px;padding:12px}
  .ruchka{right:auto;top:0;width:var(--sh);border-top:0;display:flex;flex-direction:column}
  .ruchka:before{left:auto;right:-5px;top:50%;margin:-5px 0 0}
  .istorija{display:block;flex:1;max-height:none;padding:64px 32px 12px}
  .istorija:before{content:'розмова';display:block;font:600 15px/1 'Fixel Display',sans-serif;margin-bottom:28px}
  .istorija p{font-size:16px}
  .ostannje{display:none}
  .vvid{background:var(--sol);padding:14px 32px 20px}
  .pult{top:8px}
}
</style>
</head>
<body>
<header class="verkh"><span class="ty">ти</span><span>люстерко</span><a href="#12" data-scena-do="moji">мої · 3</a></header>
<main id="korin"></main>
<footer class="ruchka" id="ruchka">
  <div class="istorija" id="ist"></div>
  <button class="ostannje" id="ost" aria-label="показати всю розмову"></button>
  <div class="vvid"><span id="pole"></span><button class="mik" aria-label="диктувати"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="6.5" y="1.5" width="5" height="9" rx="2.5"/><path d="M3.5 8.5a5.5 5.5 0 0 0 11 0M9 14v2.5"/></svg></button></div>
</footer>

<script src="вміст.js"></script>
<script src="рух.js"></script>
<script>
(function(){
var V=window.ВМІСТ,R=V.rechi,F=window.ФОТО,hrn=V.hrn,Z=V.zrozumila;
function vona(k,cl){return '<span class="foto '+(cl||'')+'"><img src="'+V.vona[k]+'" alt="'+V.vona.imja+'"></span>'}
/* шухляда: розмова до репліки n, далі — додані репліки; на телефоні закрита й показує лише останнє слово люстерка */
function sh(o){var h='';for(var i=0;i<(o.do||0);i++)h+='<p class="'+V.rozmova[i].h+'">'+V.rozmova[i].t+'</p>';(o.shche||[]).forEach(function(x){h+='<p class="'+x[0]+'">'+x[1]+'</p>'});
 document.getElementById('ist').innerHTML=h;document.getElementById('ost').textContent=o.s||'';
 var p=document.getElementById('pole');p.textContent=o.pole||'Скажи або напиши…';p.className=o.je?'je':'';
 document.querySelector('.mik').className='mik'+(o.je?' chuje':'');document.getElementById('ruchka').className='ruchka'+(o.vidkr?' vidkryta':'');
 var el=document.getElementById('ist');setTimeout(function(){el.scrollTop=el.scrollHeight},0)}
document.addEventListener('click',function(e){if(e.target.closest('#ost'))document.getElementById('ruchka').classList.add('vidkryta');else if(!e.target.closest('#ruchka'))document.getElementById('ruchka').classList.remove('vidkryta')});
function polycja(ks,o){o=o||{};return '<div class="polycja">'+ks.map(function(k){return '<figure class="'+(k===o.zm?'zm':k===o.sv?'sv':'')+'">'+F(k)+'</figure>'}).join('')+'</div>'}
function spysok(ks,o){o=o||{};var s=0;return '<div class="spysok">'+ks.map(function(k,i){var r=R[k],sv=k===o.sv;if(!sv)s+=r.cina;
 return '<details'+(i===(o.vidkr||0)?' open':'')+'><summary><b>'+r.nazva+'</b><span>'+(sv?'своє':hrn(r.cina))+'</span><small>'+r.kram+(k===o.zm?' · замість черевиків':'')+'</small></summary><p>'+r.chomu+'</p><div><a class="pl" href="'+r.url+'" target="_blank" rel="noopener">у крамницю ↗</a><button class="pl" data-scena-do="sumniv">не ця</button><button class="pl">'+(sv?'каталожна':'маю свою')+'</button></div></details>'}).join('')+'</div><p class="razom"><span>разом</span><span>'+hrn(s)+'</span></p>'}
function rjad(r){return r.ska?'<div class="rjad'+(r.umova?' umova':'')+'"><span class="l">«'+r.ska+'»</span><i>=</i><span class="p">'+r.v+(r.k==='Увага'?'<span class="tak"><button class="pl">тихо</button><button class="pl je">звично</button><button class="pl">помітно</button></span>':'')+'</span></div>'
 :'<div class="rjad"><span class="l nema">не казала</span><i class="pyt">?</i><span class="p">'+r.k.toLowerCase()+': '+r.v+'<small>'+r.chomu+'</small><span class="tak"><button class="pl">так</button><button class="pl">прибрати</button></span></span></div>'}
function suma(ks){return ks.reduce(function(a,k){return a+R[k].cina},0)}

window.СЦЕНИ=[
{id:'pochatok',nazva:'порожній початок',html:function(){sh({s:'Я — люстерко, що відповідає. Покажи себе й скажи, куди йдеш, — зберу образ із речей українських крамниць.',pole:'Куди збираєшся?'});
 return '<h1 class="naz na-osi">Стань перед люстерком</h1><div class="os" style="margin-top:14px"><button class="foto pusto l" data-nema="твоє фото на повен зріст — торкнись" data-dali></button><span class="foto sklo pusto p" style="outline:0" data-nema="тут буде відбиття: ти, вдягнена до нагоди"></span></div>'+
 '<p class="pid na-osi" style="max-width:300px;margin-top:14px">Нема фото? Назви свої барви словами — волосся, очі, шкіра. Теж зберу.</p>'}},
{id:'znajomstvo',nazva:'знайомство й фото',html:function(){sh({do:1,s:'Бачу тебе, '+V.vona.imja+'. Запам’ятала — більше не питатиму. Куди збираємось?'});
 return '<div class="os"><div class="l">'+vona('zrist')+'</div><div class="p"><p class="pid" style="margin-bottom:8px">бачу в тобі</p><div class="stovp" style="height:auto">'+V.vona.barvy.map(function(b,i){return '<div class="'+(i?'':'sv')+'" style="background:'+b[1]+';height:64px">'+b[0]+'</div>'}).join('')+'</div><p style="margin-top:12px;font-weight:600">тепла гама</p><p class="pid" style="margin-top:8px">обхвати '+V.vona.obkhvaty+'</p><button class="pl" style="margin-top:10px;min-height:36px;font-size:14px">виправити</button></div></div>'+
