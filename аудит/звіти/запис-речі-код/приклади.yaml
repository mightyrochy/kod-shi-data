# Проба на папері: 40 речей огляду (`ohliad-zapysu/новий.json`), закодовані вручну за `проєкт_коду.yaml`.
# Джерела — фото `ohliad-zapysu/foto/<ід>.jpg` (дивилась сама) і слова крамниці з каталогу v1; моделлю нічого не проганяли.
# код — що пише прохід (фото чи слова крамниці); крамниця — поля, значення яких узято зі слів крамниці;
# виведено — що порахує код за правилами `виведено` (тут — вручну за тими правилами);
# поза — факти вільного опису (Sonnet, новий запис), що в код не лягли, з причиною (ключ `поза_кодом` чи пояснення).
# першими — порядок десяти речей угорі ПРИКЛАДИ.md (де новий код міняє найбільше), чому — одним рядком.

