    вирок: не_про_річ
    чому: "масштаб і форма рис обличчя — профіль людини; бік речі (масштаб прикраси, довжина на тілі) у коді є"
  - правила: [K-HAT-01]
    вирок: не_про_річ
    чому: "обхват голови людини; обхват убору — мірка крамниці «обхват_голови»"
  - правила: [K-WCH-01]
    вирок: не_про_річ
    чому: "ворота — ширина зап'ястя людини проти корпусу годинника"
  - правила: [K-FIT-01, K-OUT-06, K-OUT-07, K-OUT-30, K-OUT-41, K-OUT-42, K-SIZ-01, K-SIZ-02]
