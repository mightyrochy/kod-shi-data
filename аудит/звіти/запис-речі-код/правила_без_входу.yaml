  - правила: [K-SHO-13, K-SHO-14, K-SHO-15]
    вирок: не_про_річ
    чому: "довжина й повнота стопи — мірки ноги; розміри відкладено продуктом"
  - правила: [K-MEN-01, K-MEN-02, K-MEN-03, K-MEN-04, K-MEN-05, K-MEN-06, K-MEN-07, K-MEN-08, K-MEN-09, K-MEN-10,
             K-MEN-11, K-MEN-12, K-MEN-13, K-MEN-14, K-MEN-15, K-MEN-16, K-MEN-17, K-MEN-18, K-MEN-19, K-MEN-20,
             K-MEN-21, K-MEN-22, K-MEN-23, K-MEN-24]
    вирок: не_про_річ
    чому: "правила чоловічого образу: бракує чоловічого профілю, а продукт складає жіночий (каталог «ж-»); факти речі, яких вони просять, у коді є — довжина, довжина рукава, посадка, бортність, комір, носок, застібка, матеріал підошви, деталі («стрілки»)"
  - правила: [K-CHN-01, K-LNG-04, K-IO-01, K-IO-02, K-IO-03, K-IO-04, K-IO-05, K-IO-06, K-SIG-01]
    вирок: не_про_річ
