# Вирок кожному правилу знань, якому бракувало входу: 57 правил з вердиктом «без входу» у `джерела/аудит/ЗВЕДЕННЯ.md`
# і кожне «не покривається» з `аудит/звіти/запис-речі-мітки/МІТКИ.md` (розд. 3) та `РЕШТА-ПРАВИЛ.md` (наряд, мірило ґ).
# Формулювання правил — `джерела/аудит/ПРАВИЛА.md`. Перевіряє й зводить у таблицю `скрипти/перевірка.py` (ґ).
#
# вирок:
#   поле — правилу бракувало факту про річ, і проєкт його дає. «поля» — назви полів проєкту, частини складених полів
#     («малюнок.напрям») чи розділи будови («стани», «джерела», «місця»). Правило проєкт вмикає.
#   не_про_річ — правилу бракує факту людини (мірки тіла, риси, профіль), ситуації, гардероба, історії чи
#     процесу; запис товару його не дає за будовою. Поля речі, які правило теж читає, названо в «чому».
#   джерела_нема — бракує факту про річ, але його не дає ні фото, ні слова крамниці, ні вивід; причина — у «чому».
#     Сюди ж — правило без формулювання в корпусі чи скасоване: нема умови, для якої шукати вхід.

вироки:
  # ------------------------------------------------------------------ поле: проєкт дає вхід
  - правила: [K-EYE-03]
    вирок: поле
    поля: [вид, колір, колір_металу]
    чому: "оправа — змінний колір біля обличчя: вид «окуляри» (місце «інше») і колір оправи з фото; у каталозі 99 окулярів"
  - правила: [K-HAT-02]
    вирок: поле
    поля: [поля_убору, структура]
    чому: "край полів на рівні обличчя — ширина полів шкалою «вузькі · середні · широкі»; ошатність несе жорсткість — структура"
  - правила: [K-PRN-01, R-HELM-07]
    вирок: поле
    поля: [колір, малюнок.мотив, малюнок.напрям]
    чому: "світлота — з відтінку ISCC-NBS кольору; смуги — мотив, їхній напрям — нова частина малюнка «напрям»"
  - правила: [K-SIL-04]
    вирок: поле
    поля: [малюнок.напрям, застібка, деталі, довжина, бортність, колір]
    чому: "вертикалі: планка — застібка «де: перед», стрілки — деталі, відкритий довгий шар — довжина й бортність, колонка кольору — колір"
  - правила: [K-SIL-05]
    вирок: поле
    поля: [колір, товщина, поверхня, структура, силует, товщина_підошви, висота_взуття]
    чому: "візуальна вага: темне — колір, щільне — товщина, фактурне — поверхня, широке — силует; маса взуття — підошва й висота"
  - правила: [K-WCH-02]
    вирок: поле
    поля: [мірки_крамниці, матеріал, блиск]
    чому: "товщина корпусу — нова мірка крамниці «товщина_корпусу» (мм); ремінець — матеріал і блиск"
  - правила: [K-WCH-03]
    вирок: поле
    поля: [вид]
    чому: "годинник — вид «годинник»; код зараховує його до прикрас на зап'ясті; у каталозі 18 годинників"
  - правила: [R-PRN-02]
    вирок: поле
    поля: [малюнок.масштаб]
    чому: "мікромалюнок до ~1 см — нове значення масштабу «мікро» з межею «менший за ніготь мізинця»"
  - правила: [R-PRN-05]
    вирок: поле
    поля: [малюнок.мотив, малюнок.масштаб, колір]
    чому: "зіткнення принтів: спільний колір — кольори з частками, контракт масштабу — масштаб; намір — бриф, він у продукті є"
  - правила: [R-PRN-06]
    вирок: поле
    поля: [малюнок.мотив, колір]
    чому: "тваринний принт — мотив «під шкіру тварини»; приглушеність — хрома відтінків ISCC-NBS"
  - правила: [R-PRN-07]
    вирок: поле
    поля: [малюнок.розміщення]
    чому: "розміщення — суцільний · розміщений · кайма · частковий, рівно поле, якого правило просить"
  - правила: [R-PRN-08]
    вирок: поле
    поля: [колір, малюнок.контраст]
    чому: "розкид світлоти між домінантами — з відтінків і часток кольору; видимий контраст — частина малюнка"
  - правила: [R-PRN-09, R-PRN-09a, R-PRN-09b]
    вирок: поле
    поля: [малюнок.мотив, оздоба.що, колір]
    чому: "09a: статутний камуфляж — нове значення мотиву «статутний», шеврон і нашивка — нове значення оздоби «військова символіка»; 09b: мотив «камуфляж» і хакі в кольорі"
  - правила: [K-WEA-06]
    вирок: поле
    поля: [протектор, матеріал_підошви]
    чому: "перевірні ознаки правила — гладка підошва, глибина протектора, тверда підошва — є; коефіцієнта зчеплення правило не вимагає"
  - правила: [K-OUT-15]
    вирок: поле
    поля: [утеплення]
    чому: "вето на fill power без маси: утеплення має ступінь із межею в грамах і наповнювач, fill power полем не є"
  - правила: [K-OUT-27]
    вирок: поле
    поля: [утеплення]
    чому: "«пуховик» у назві не означає пуху: наповнювач — лише зі складу крамниці, вид не підставляє наповнювача"
  - правила: [R-FEED-07]
    вирок: поле
    поля: [мірки_крамниці]
    чому: "мірки беруться зі сторінки, не з фіда: мірки крамниці — закритий перелік «що» з одиницями, довжина окремо від обхватів"
  - правила: [R-FP-01]
    вирок: поле
    поля: [вид]
    чому: "категорія й ознаки — окремі осі: вид окремо від полів, прізвиська виводить код"
  - правила: [R-FP-02, R-FP-06]
    вирок: поле
    поля: [стани]
    чому: "пропуск — не збій: «невідомо», «не стосується», «не певний» з кандидатами; значення поза переліком модель пише станом «не певний» з найближчими"
  - правила: [R-FP-03]
    вирок: поле
    поля: [місця]
    чому: "надкатегорії Fashionpedia — контрольний список повноти будови за місцем (ПРОЄКТ, 1.2)"
  - правила: [R-FP-04]
    вирок: поле
    поля: [джерела, стани]
    чому: "надійність за видом ознаки: кожен факт несе джерело, ознака на межі — «не певний»"
  - правила: [R-FP-05]
    вирок: поле
    поля: [місця, вид, прізвисько]
    чому: "глибина таксономії — три рівні: місце → вид → прізвисько"
  - правила: [R-FP-07]
    вирок: поле
    поля: [прізвисько]
    чому: "прізвиська — найризиковіший вихід: модель їх не пише, код виводить з виду й полів"
  - правила: [R-ONT-05]
    вирок: поле
    поля: [склад, оздоба, застібка, кишені]
    чому: "частини не сплющено: комплект — склад частин зі своїми полями, частини речі — складені факти «що · де · скільки»"

  # ------------------------------------------------------------------ не про річ
  - правила: [K-EYE-01, K-EYE-04]
    вирок: не_про_річ
    чому: "посадка оправи й рецепт — мірки обличчя й зір людини; вид і колір оправи в коді є"
