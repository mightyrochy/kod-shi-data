  метал: {дія: розділено, нове: [метал, колір_металу, проба, покриття], чому: "white_gold, rose_gold, two_tone змішували речовину з кольором; срібло з позолотою — метал срібло, колір жовтий", джерело: мітка}
  тепло_шару: {дія: виведено, нове: [тепло], чому: "уже виведене; тепер з волокна основи, товщини й утеплення", джерело: мітка}
  довжина_виробу: {дія: злито, нове: [мірки_крамниці], чому: "см виробу — одна з мірок крамниці", джерело: Річ}
