  хибне_місце: "запис сцени поставив річ не в те місце (штани чи пальто в «пояс», болеро в «шарф»); новий код виводить місце з виду, і факт лягає в поле свого місця"
  не_про_цю_річ: "факт про річ, з якою товар показано (светр під брошкою, топ над штанами); код описує лише товар"
  форма_фурнітури: "форма пряжки чи ґудзика (квадратна, кругла): стилістка зважує тон і масштаб фурнітури — вони в коді (колір металу, оздоба · масштаб), а форму видно на фото"
  бренд: "бренд — властивість пропозиції; уже є в назві й колонці крамниці; стилістка не добирає за брендом"
  розмірна_сітка: "розміри відкладено продуктом; мірки крамниці лишаються"
  догляд: "правила прання не міняють образу; стилістка їх не читає"
  стан: "новий чи вживаний — властивість пропозиції (ресейл), не речі в образі"
  країна: "країна виробництва не міняє образу"
  пакування: "коробка, пильовик, сертифікат — не річ"
  речовина_вставки: "діамант чи фіаніт: з фото не розрізнити, стилістці досить «прозорий камінь»; ціну несе колонка ціни"
  спосіб_пов'язати: "як пов'язати шарф — порада, не властивість; можливі способи визначає розмір шарфа"
  стиль_крамниці_маркетинговий: "«fashion», «трендовий», «стильний» — оцінка без ознаки; стилі зі значенням нагоди йдуть у нагоду крамниці"
  розбіжність_фото_крамниці: "суперечність джерел не факт речі; кожен факт несе джерело, а суперечність — стан «не певний»"
  вага: "вага прикраси чи сумки в грамах — поза образом; масштаб несе розмір"
  посадка_на_нозі: "повнота стопи, підйом, маломірить — розмірна властивість, відкладено з розмірами"

# Перехід із 16 міток `мітки_речі.json` і з усіх полів Річ, які читає ядро
переходи:
  опис: {дія: лишається, нове: [], чому: "вільний текст лишається для картки людини й судді; його факти тепер мають поля, у пул іде стислий рядок, не опис", джерело: мітка}
  слот: {дія: перейменовано, нове: [місце], чому: "той самий реєстр слотів; модель пише вид, слот виводить код — розбіжність «верх чи верхній шар» для жилета й кардигана зникає", джерело: мітка}
  тип: {дія: розділено, нове: [вид, силует, прилягання, полотно, різновид_полотна, довжина, склад, прізвисько], чому: "тип змішував конструкцію з силуетом, тканиною, довжиною й ошатністю; item_type виводить код таблицею тип_ядра", джерело: мітка}
  крій: {дія: розділено, нове: [силует, прилягання, бортність, лінія_талії, деталі, додані_частини], чому: "крій змішував обрис, вільність, застібку (double-breasted, wrap), пасок (belted) і складки (pleated)", джерело: мітка}
  довжина: {дія: перейменовано, нове: [довжина], чому: "6 кодів → шкала тіла з 18 орієнтирів, спільна з рукавом, взуттям і прикрасами; старі коди — інтервали шкали", джерело: мітка}
  тканина: {дія: розділено, нове: [матеріал, волокно, полотно, різновид_полотна, поверхня, блиск], чому: "40 кодів змішували волокно (wool), будову (knitted, woven), назву полотна (denim), речовину (leather) і поверхню (suede, patent)", джерело: мітка}
  візерунок: {дія: розділено, нове: [малюнок, оздоба, полотно], чому: "мотив, техніка, масштаб і контраст — частини малюнка; вишивка — оздоба, мереживо — полотно чи оздоба", джерело: мітка}
  колір: {дія: лишається, нове: [колір, колір_металу], чому: "відтінки ISCC-NBS з частками не міняються; тон металу — окреме поле, бо «срібний» колір не значить срібло", джерело: мітка}
  ошатність: {дія: виведено, нове: [ошатність, нагода_крамниці], чому: "моделі розійшлись у 152 з 299: щабель без ознак; тепер код виводить інтервал з полів, а слово крамниці про нагоду — окремий факт", джерело: мітка}
  сезон_тканини: {дія: виведено, нове: [погода, сезон_крамниці], чому: "моделі розійшлись у 120 з 236, сезон з фото не видно; погоду виводить код з волокна, товщини, утеплення, водостійкості", джерело: мітка}
  каблук: {дія: перейменовано, нове: [каблук_см, форма_каблука, товщина_підошви], чому: "см лишаються; форма каблука й платформа — окремі поля", джерело: мітка}
  підошва: {дія: розділено, нове: [протектор, матеріал_підошви, товщина_підошви], чому: "smooth і lug — рельєф, polyurethane і tpr — речовина; з фото видно рельєф, речовину — лише зі слів", джерело: мітка}
  водостійкість: {дія: лишається, нове: [водостійкість], чому: "лише слова крамниці; yes розщеплено на водонепроникна й водовідштовхувальна, no — не захищена", джерело: мітка}
