  малюнок:
    назва: малюнок
    означення: Повторюваний чи розміщений малюнок полотна — мотив, техніка, масштаб, напрям ліній (лише для смуг і ліній), розміщення, контраст.
    де: [текстиль]
    кратність: кілька
    джерело: [фото, крамниця]
    невідомо: фото нечітке чи показує лише фрагмент
    ядро: pattern (solid=немає; polka_dot=горох; floral; stripes; check=клітинка; animal_print=під_шкіру_тварини; camouflage; geometric; abstract; print_generic=друк без мотиву; lace_motif і embroidery — у полотно й оздобу)
    у_рядку: так
    склад:
      мотив: {список: мотив}
      техніка:
        значення:
          друк: "друк | фарба на поверхні, виворіт світліший"
          ткацтво: "ткацтво | малюнок із переплетення (жакард, ткана клітинка), однаковий з обох боків чи інвертований"
          в'язання: "в'язання | малюнок петлями різного кольору чи рельєфу"
          фарбування: "фарбування | розмиті переходи (тай-дай, градієнт, варка)"
      масштаб: {список: масштаб}
      напрям:
        значення:
          вертикальний: "вертикальний | лінії мотиву йдуть уздовж тіла, від плеча до поділу"
          горизонтальний: "горизонтальний | лінії йдуть поперек тіла, паралельно подолу"
          діагональний: "діагональний | лінії під помітним кутом і до подолу, і до бокового шва"
          різний: "різний | на різних частинах речі лінії йдуть по-різному (рукав поперек, корпус уздовж)"
      розміщення:
        значення:
          суцільний: "суцільний | повтор по всій речі"
          кайма: "кайма | смугою вздовж краю"
          розміщений: "розміщений | одне чи кілька окремих зображень у певному місці"
          частковий: "частковий | суцільний повтор лише на частині речі"
      контраст:
        значення:
          тон_в_тон: "тон у тон | той самий колір іншою фактурою чи відтінком, видно лише зблизька"
          помірний: "помірний | різниця кольорів помітна, але не різка"
          контрастний: "контрастний | світлий на темному чи навпаки, видно здалеку"

  оздоба:
    назва: оздоба
    означення: Додане до полотна оздоблення — що, де, скільки, масштаб і мотив (що зображує вишивка, аплікація, стразовий бант), де вони важать.
    де: усі
    кратність: кілька
    джерело: [фото, крамниця]
    невідомо: видно лише частину речі
    ядро: pattern (embroidery, lace_motif) — переведено в оздобу
    у_рядку: так
    склад:
      що:
        значення:
          вишивка: "вишивка | нитки вшиті в полотно малюнком"
          мереживо: "мереживо | вставка чи обробка мереживом на немереживному полотні"
          аплікація: "аплікація | нашиті фігури з іншого матеріалу"
          паєтки: "паєтки | пласкі блискучі диски"
          бісер: "бісер чи намистини | дрібні намистини; від перлів — не перламутрові"
          стрази: "стрази чи кристали | грановані блискучі камінці"
          перли: "перли | перламутрові кульки"
          заклепки: "заклепки чи шипи | металеві опуклі елементи, люверси"
          бахрома: "бахрома | ряд звисаючих ниток чи смужок"
          китиці: "китиці чи помпони | пучки ниток"
          пір'я: "пір'я | пір'я"
          опушка: "опушка | смуга хутра по краю; від матеріалу хутро — лише край"
          бант: "бант | зав'язаний чи пришитий бант"
          квітка: "квітка | об'ємна квітка з тканини"
          стрічка: "стрічка | нашита стрічка"
          кант: "кант | смуга по краю чи шву іншим кольором"
          строчка: "декоративна строчка | видимі контрастні шви"
          логотип: "логотип чи напис | нашивка, металева табличка, тиснення, друкований знак бренду"
          військова_символіка: "військова символіка | шеврон, погон, нашивка ЗСУ чи підрозділу; від «логотип» — знак війська, а не бренду"
          ланцюжок: "ланцюжок | декоративний ланцюжок"
          ґудзики: "декоративні ґудзики | ґудзики не застібають"
      де: {список: зона}
      скільки: {список: кількість}
      масштаб: {список: масштаб}
      мотив: {список: мотив}

  деталі:
    назва: деталі крою
    означення: Конструктивні деталі крою — що й де.
    де: усі
    кратність: кілька
    джерело: [фото, крамниця]
    невідомо: видно лише частину речі
    ядро: крій (pleated, belted, peplum, wrap) і ярус_крою — переведено сюди
    у_рядку: так
    склад:
      що:
        значення:
          складки: "складки | заглажені рівні складки; від зборок — рівні й заглажені"
          зборки: "зборки | дрібно зібране полотно"
          драпування: "драпування | вільні діагональні складки, закріплені в одному місці"
          волани: "волани чи рюші | пришиті хвилясті смужки полотна"
          яруси: "яруси | горизонтальні пришиті смуги, що розширюються донизу"
          розріз: "розріз чи шліца | розріз по краю"
          виріз_вставка: "виріз у полотні | отвір у тканині поза горловиною"
          асиметрія: "асиметрія | лівий і правий бік різні"
          кокетка: "кокетка | відрізна частина на плечах чи стегнах"
          погони: "погони | смужки на плечах"
          стрілки: "стрілки | заглажена лінія по передку штанин"
          баска: "баска | розширена коротка смуга нижче талії"
          корсет: "корсет | кісточки чи шнурівка тримають тулуб"
          защипи: "защипи чи виточки рельєфні | помітні прострочені складки"
          відвороти: "відвороти | підвернутий край рукава чи штанини"
          резинка: "резинка | еластичний пояс чи низ"
          кулиска: "кулиска | шнурок у тунелі"
          хлястик: "хлястик | регулювальна смужка"
          підплічники: "підплічники | сформоване підняте плече"
          клапан: "клапан | клапан сумки поверх отвору"

  бортність:
    назва: бортність
    означення: Як сходяться передні краї верху.
    де: [верх, верхній_шар, сукня]
    кратність: одне
    джерело: [фото, крамниця]
    невідомо: перед не видно
    ядро: крій (double-breasted, wrap) — переведено сюди
    у_рядку: "так, якщо двобортна чи на_запах — однобортність звична"
    значення:
      суцільна: "суцільна | перед без розрізу"
      однобортна: "однобортна | один ряд застібки по центру"
      двобортна: "двобортна | краї заходять, два ряди ґудзиків"
      на_запах: "на запах | одна пола заходить глибоко, тримає пасок чи зав'язка; від двобортної — нема двох рядів"
      відкрита: "відкрита | краї не сходяться, застібки нема"

  застібка:
    назва: застібка
    означення: Чим і де річ застібається, і чи застібку видно.
    де: усі
    кратність: кілька
    джерело: [фото, крамниця]
    невідомо: застібки не видно, крамниця мовчить
    у_рядку: "ні — засіб і місце застібки видно на фото картки; на образ впливає лише видима оздоба (поле «оздоба»)"
    склад:
      засіб: {список: засіб_застібки}
      де: {список: зона}
      видимість:
        значення:
          видима: "видима | застібку видно на лиці"
          потайна: "потайна | прихована планкою чи всередині"

  кишені:
    назва: кишені
    означення: Вид кишень, де й скільки.
    де: [одяг, сумка]
    кратність: кілька
    джерело: [фото, крамниця]
    невідомо: видно лише частину речі
    у_рядку: "ні — на образ не впливають; видно на фото картки"
    склад:
      вид:
        значення:
          накладна: "накладна | пришита зверху"
          прорізна: "прорізна | щілина в полотні без клапана"
          з_клапаном: "з клапаном | щілина чи накладна з клапаном зверху"
          у_шві: "у шві | прихована в бічному шві"
          коса: "коса | передня коса кишеня штанів"
          кенгуру: "кенгуру | одна велика кишеня спереду з двома входами"
      де: {список: зона}
      скільки: {список: кількість}

  комір:
    назва: комір
    означення: Комір чи лацкани навколо горловини.
    де: [верх, сукня, верхній_шар, комплект]
    кратність: одне
    джерело: [фото, крамниця]
    невідомо: горловину закрито волоссям чи шарфом
    ядро: комір (поле Річ)
    у_рядку: так, якщо є
    значення:
      немає: "немає | горловина без коміра"
      стійка: "стійка | вертикальна смуга навколо шиї, не відвертається"
      гольф: "гольф | високий трикотажний комір, підвертається на шиї"
      відкладний: "відкладний | лежить на плечах, сорочкового типу"
      пітер_пен: "пітер-пен | відкладний з округлими кінцями"
      лацкани: "лацкани | відкладний комір із лацканами (англійський, з виїмкою, шалевий без виїмки — «шалевий»)"
      шалевий: "шалевий | лацкан суцільний, без виїмки"
      апаш: "апаш | розкритий без стійки, лежить на плечах"
      бант: "комір-бант | зав'язується бантом"
      хомут: "хомут | широка труба навколо шиї"
      матроський: "матроський | квадратний клапан ззаду"

  капюшон:
    назва: капюшон
