    спина: "спина | зворотний бік"
    талія: "талія | пояс речі чи лінія талії"
    бік: "бік | бічні шви й боки"
    поділ: "поділ | нижній край речі"
    вся_поверхня: "вся поверхня | рівно по всій речі; від окремих зон — нема зони без ознаки"
