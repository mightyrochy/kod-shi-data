          u: "U | глибока дуга з рівними сторонами"
          квадратний: "квадратний | прямі кути"
          човник: "човник | широкий неглибокий від плеча до плеча"
          сердечко: "сердечко | дві дуги над грудьми"
          халтер: "халтер | бретелі сходяться на шиї"
          одне_плече: "на одне плече | одне плече відкрите"
          відкриті_плечі: "відкриті плечі | обидва плечі відкриті, край нижче плечей"
          драпований: "драпований | м'які складки на грудях"
