поля:
  місце:
    назва: місце в образі
    означення: Слот добору, у якому річ стоїть в образі.
    де: усі
    кратність: одне
    джерело: [код]
    реєстр: ядро.місце_речі.СЛОТИ_ЗАПИСУ (+ «інше» поза добором)
    виведено: з виду — кожен вид належить одному місцю; жилет, кардиган, жакет — верхній шар (ядро._ЗА_ТИПОМ), комбінезон — сукня
    у_рядку: ні — місце вже є колонкою пулу

  вид:
    назва: вид
    означення: Найменший іменник конструкції речі в межах місця — без силуету, тканини, довжини й ошатності.
    де: усі
    кратність: одне
    джерело: [фото, крамниця]
    невідомо: на фото інша річ чи логотип, а назва крамниці не називає речі
    не_певний: дві сусідні конструкції (пуловер чи кардиган, коли перед не видно)
    ядро: item_type виводить код таблицею «тип_ядра» з виду й полів; слот — з виду
    у_рядку: так
    значення_за_місцем:
      верх:
        футболка: "футболка | трикотажне полотно, без застібки на всю довжину, з рукавом; від пуловера — тонке полотно без резинки по низу; від топу — є рукав"
        топ: "топ | без рукава або на бретелях, низ не нижче стегон; від футболки — нема рукава; від сукні — коротший"
        блуза: "блуза | з тканини, без пари «планка на ґудзики на всю довжину + сорочковий комір»; від сорочки — цієї пари нема"
        сорочка: "сорочка | з тканини, планка на ґудзиках на всю довжину й сорочковий комір чи стійка; від жакета — тонка тканина, без лацканів"
        пуловер: "пуловер | в'язане чи щільне трикотажне полотно з манжетами чи резинкою, без розкритого переду (светр, джемпер, світшот, худі, водолазка — прізвиська); від кардигана — перед суцільний"
        боді: "боді | замкнений низ із застібкою між ногами; від топу — замкнений низ"
      низ:
        штани: "штани | дві штанини, поділ нижче коліна; від шортів — довжина"
        шорти: "шорти | дві штанини, поділ на коліні чи вище; від спідниці — є штанини (спідниця-шорти — шорти)"
        спідниця: "спідниця | одна труба без штанин"
      сукня:
        сукня: "сукня | одна річ від плечей чи грудей донизу без штанин, поділ нижче стегон; від топу — довжина; від комбінезона — нема штанин"
        комбінезон: "комбінезон | одна річ від плечей зі штанинами"
      комплект:
        комплект: "комплект | дві й більше речі продаються однією позицією (одна ціна, одна картка); від речі з образу на фото — крамниця продає частини разом (назва «костюм», «комплект», «двійка» чи мірки кількох частин)"
      верхній_шар:
        жакет: "жакет | кроєний з тканини, рукав, сформоване плече, лацкани чи підкладка, поділ не нижче середини стегна; від куртки — нема блискавки чи кнопок як головної застібки, нема утеплення; від пальта — довжина"
        кардиган: "кардиган | в'язане чи трикотажне полотно з розкритим чи розстібним переднім краєм; від пуловера — перед розкритий; від жакета — полотно в'язане"
        жилет: "жилет | без рукава, розкритий чи розстібний перед, носять поверх; від топу — щільна кроєна тканина чи розкритий перед"
        пальто: "пальто | верхній одяг, поділ нижче середини стегна; від куртки й жакета — довжина"
        куртка: "куртка | верхній одяг з поділом до середини стегна, головна застібка блискавка чи кнопки, або шкіра, плащова, стьобана тканина; від жакета — ці ознаки"
        накидка: "накидка | закриває плечі й руки без звичного рукава (пончо, кейп); від жилета — плечі закриті"
        кімоно: "кімоно | легкий відкритий перед без застібки, рукав кімоно цільнокроєний; від кардигана — тканина; від жакета — нема сформованого плеча"
      взуття:
        туфлі: "туфлі | закриті носок і п'ята, верх нижче щиколотки, без накладки на підйомі; від лоферів — низький вирізаний верх"
        лофери: "лофери | без застібки, високий закритий перед із накладкою чи перемичкою, окрема тверда підошва з каблуком; від мокасинів — тверда підошва"
        мокасини: "мокасини | м'який верх обхоплює стопу знизу, шов-обідок по передку, без окремого каблука"
        оксфорди: "оксфорди | закриті нижче щиколотки на шнурівці з класичною твердою підошвою (оксфорди, дербі, броги); від кросівок — не спортивні верх і підошва"
        кросівки: "кросівки | спортивний верх, товста профільована амортизуюча підошва; від кедів — профіль підошви"
        кеди: "кеди | пласка гумова підошва з гумовим обідком, текстильний чи шкіряний верх"
        сандалі: "сандалі | відкритий верх із ремінців, п'ята закріплена ремінцем чи задником; від шльопанців — п'ята закріплена"
        мюлі: "мюлі | закритий чи напівзакритий носок без задника, тонка підошва; від сабо — тонка підошва; від шльопанців — закритий носок"
        сабо: "сабо | без задника, закритий об'ємний носок, товста жорстка підошва"
        шльопанці: "шльопанці | відкритий носок без задника, тримаються ремінцем чи перемичкою (в'єтнамки — прізвисько)"
        черевики: "черевики | закривають щиколотку, халява не вище низу литки; від чобіт — висота"
        чоботи: "чоботи | халява вище низу литки"
      сумка:
        сумка: "сумка | має ручку чи ремінь; від клатча — є ручка чи постійний ремінь"
        клатч: "клатч | без ручки й постійного ременя, носять у руці (знімний ланцюжок виду не змінює)"
        рюкзак: "рюкзак | два плечові ремені на спину"
