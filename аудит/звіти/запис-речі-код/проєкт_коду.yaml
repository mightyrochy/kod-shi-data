      низька: "низька | на тазових кістках чи нижче"

  довжина:
    назва: довжина
    означення: Де поділ на тілі, за шкалою тіла; один орієнтир чи інтервал двох сусідніх.
    де: [одяг]
    кратність: одне
    джерело: [фото, крамниця, код]
    шкала: тіло
    діапазон: [під_грудьми, підлога]
    невідомо: поділу не видно на тілі (крупний план, предметно, закладено) і нема см виробу
    не_певний: поділ між двома орієнтирами — пишеться інтервал «X–Y»
    ядро: довжина → довжина_рівень (порядок шкали); довжина_виробу — у мірки_крамниці
    у_рядку: так

  підкладка:
    назва: підкладка
    означення: Чи є шар з виворіту.
    де: [одяг, взуття, сумка, головний_убір, пояс]
    кратність: одне
    джерело: [крамниця, фото]
    невідомо: виворіт не видно, крамниця мовчить
    у_рядку: ні — важить лише для тепла, тепло виводить код
    значення:
      немає: "немає | сказано, що без підкладки, чи видно виворіт без неї"
      часткова: "часткова | підкладка лише в частині"
      повна: "повна | підкладка по всій речі"

  утеплення:
    назва: утеплення
    означення: Утеплювач — ступінь і наповнювач.
    де: [верхній_шар, взуття, головний_убір, комплект]
    кратність: одне
    джерело: [крамниця, фото]
    невідомо: крамниця не каже, фото товщини не показує
    не_певний: об'ємне стьобання видно, грамів і слів нема
    ядро: утеплення (none, light, warm)
    у_рядку: так, якщо є
    склад:
      ступінь:
        значення:
          немає: "немає | сказано «без утеплювача»"
          легке: "легке | до ~100 г/м² синтетики, байка, фліс, тонка вовна; чи крамниця — «демісезон»"
          тепле: "тепле | понад ~100 г/м², пух, хутро, овчина; чи крамниця — «зима»"
      наповнювач:
        значення:
          пух: "пух | пух чи пух із пером"
          синтетичний: "синтетичний | синтепон, холофайбер, тінсулейт, Comfortemp"
          вовна: "вовна | вовняний утеплювач"
          хутро: "хутро | хутро чи єврохутро з виворіту"
          байка: "байка чи фліс | начосна підкладка"

  водостійкість:
    назва: водостійкість
    означення: Захист від води за словами крамниці.
    де: [верхній_шар, взуття, сумка]
    кратність: одне
    джерело: [крамниця, код]
    невідомо: крамниця мовчить
    ядро: водостійкість (yes, no)
    у_рядку: так, якщо є
    значення:
      водонепроникна: "водонепроникна | мембрана, проклеєні шви, гума — сказано чи матеріал гума"
      водовідштовхувальна: "водовідштовхувальна | просочення, DWR, «від мряки»"
      не_захищена: "не захищена | крамниця радить берегти від вологи"

  сезон_крамниці:
    назва: сезон за крамницею
    означення: Сезон, як його каже крамниця; модель не оцінює.
    де: усі
    кратність: кілька
    джерело: [крамниця]
    невідомо: крамниця мовчить
    ядро: сезон_тканини — модель його більше не оцінює, погоду виводить код
    у_рядку: ні — у рядок іде виведена погода
    значення:
      літо: "літо | «літо», «літній»"
      весна_осінь: "весна-осінь | «демісезон», «весна», «осінь»"
      зима: "зима | «зима», «зимовий»"
      всесезон: "усі сезони | «всесезонна», «круглий рік»"

  нагода_крамниці:
    назва: нагода за крамницею
    означення: Нагода чи стиль, як їх каже крамниця.
    де: усі
    кратність: кілька
    джерело: [крамниця]
    невідомо: крамниця мовчить
    ядро: ошатність — модель її більше не оцінює, щабель виводить код
    у_рядку: ні — у рядок іде виведений щабель
    значення:
      щодня: "щодня | «повсякденний», «casual», «на кожен день»"
      офіс: "офіс | «діловий», «офісний», «класичний»"
      вечір: "вечір чи свято | «вечірній», «коктейльний», «свято»"
      урочистість: "урочистість | «весільний», «випускний», «на церемонію»"
      спорт: "спорт | «спортивний», «для тренувань»"
      відпочинок: "відпочинок | «пляжний», «для відпустки»"
      дім: "дім | «домашній», «для сну», «лаунж»"

  мірки_крамниці:
    назва: мірки крамниці
    означення: Числа крамниці — що, скільки, одиниці, розмір.
    де: усі
    кратність: кілька
    джерело: [крамниця]
    ядро: мірки_крамниці (посадка_пояса, каблук, халява, ланцюг см) і довжина_виробу
    у_рядку: ні, крім висоти каблука
    склад:
      що:
        значення:
          довжина_виробу: "довжина виробу | від плеча чи пояса до поділу"
          довжина_рукава: "довжина рукава | від плеча до краю"
          обхват_грудей: "обхват грудей | виробу"
          обхват_талії: "обхват талії | виробу"
          обхват_стегон: "обхват стегон | виробу"
          ширина_плечей: "ширина плечей | виробу"
          довжина_штанини: "довжина штанини | по боковому шву"
          крок: "крок | довжина крокового шва"
          висота_каблука: "висота каблука | см"
          висота_платформи: "висота платформи | см"
          висота_халяви: "висота халяви | см"
          обхват_халяви: "обхват халяви | см"
          довжина_устілки: "довжина устілки | см"
          висота: "висота | предмета (сумка, прикраса)"
          ширина: "ширина | предмета"
          глибина: "глибина | предмета"
          довжина_ланцюга: "довжина ланцюга | см"
          діаметр: "діаметр | см"
          зріст_моделі: "зріст моделі | см"
          розмір_на_моделі: "розмір на моделі | розмір"
          обхват_голови: "обхват голови | см по колу голови, де сидить убір"
          щільність: "щільність | г/м² полотна; від «товщини» — число крамниці, а не видиме"
          товщина_корпусу: "товщина корпусу | мм корпусу годинника від скла до кришки; від «ширини» — висота над зап'ястям"
      число: {число: "см"}
      розмір: {текст: "розмір, до якого число"}

  додані_частини:
    назва: додані частини
    означення: Що йде в комплекті з річчю чи знімається, крім капюшона.
    де: усі
    кратність: кілька
    джерело: [крамниця, фото]
    у_рядку: так
    склад:
      що:
        значення:
          пасок: "пасок | пасок у комплекті з одягом"
          ремінь: "ремінь | плечовий ремінь сумки"
          ланцюжок: "ланцюжок | ланцюжок-ручка"
          хутряний_комір: "хутряний комір | знімний хутряний комір"
          гаманець: "гаманець чи косметичка | менша сумочка всередині"
          брошка: "брошка | у комплекті"
      знімна:
        значення:
          так: "так | знімається"
          ні: "ні | пришита"

  висота_взуття:
    назва: висота взуття
    означення: Де закінчується верх взуття, за шкалою тіла.
    де: [взуття]
    кратність: одне
    джерело: [фото, крамниця]
    шкала: тіло
    діапазон: [середина_стегна, стопа]
    у_рядку: так
  каблук_см:
    назва: висота каблука
    означення: Висота каблука в сантиметрах; 0 — без каблука.
    де: [взуття]
    кратність: одне
    джерело: [крамниця, фото]
    число: см
    не_певний: з фото — інтервал «4–6»
    ядро: каблук → каблук_см
    у_рядку: так
  форма_каблука:
    назва: форма каблука
    означення: Обрис каблука збоку.
    де: [взуття]
    кратність: одне
    джерело: [фото, крамниця]
    у_рядку: так
    значення:
      немає: "немає | пласка підошва, каблук до 1 см"
      шпилька: "шпилька | тонкий, внизу до 1 см, від 7 см"
      тонкий: "тонкий | внизу до 1 см, нижче 7 см (кітен)"
      стовпчик: "стовпчик | широкий рівний"
      конус: "конус | звужується донизу, внизу ширший за 1 см"
      розширений: "розширений | розширюється донизу"
      танкетка: "танкетка | суцільний з підошвою від п'яти до носка"
      фігурний: "фігурний | незвичної форми"
  товщина_підошви:
    назва: товщина підошви
    означення: Товщина підошви під носком.
    де: [взуття]
    кратність: одне
    джерело: [фото, крамниця]
    у_рядку: так, якщо не тонка
    значення:
      тонка: "тонка | до 1 см"
      середня: "середня | 1–3 см"
      товста: "товста | понад 3 см (платформа)"
  протектор:
    назва: протектор
    означення: Рельєф низу підошви.
    де: [взуття]
    кратність: одне
    джерело: [фото, крамниця]
    невідомо: низу чи краю підошви не видно
    ядро: підошва (smooth, lug) — розщеплено
    у_рядку: так, якщо не гладкий
    значення:
      гладкий: "гладкий | рельєфу нема"
      рифлений: "рифлений | дрібний рельєф, збоку не видно"
      тракторний: "тракторний | глибокі зубці видно збоку"
  матеріал_підошви:
    назва: матеріал підошви
    означення: Речовина підошви за словами крамниці.
    де: [взуття]
    кратність: одне
    джерело: [крамниця]
    невідомо: крамниця мовчить
    ядро: підошва (leather, polyurethane, eva, tpr) — розщеплено
    у_рядку: ні — стилістці важать протектор і товщина
    значення:
      шкіра: "шкіра | шкіряна підошва"
      гума: "гума | гума"
      поліуретан: "поліуретан | PU, ТПУ, термополіуретан"
      теп: "ТЕП | TPR, термоеластопласт"
      ева: "ЕВА | EVA"
      джут: "джут | плетена мотузка"
  носок:
    назва: носок
    означення: Форма носка взуття згори.
    де: [взуття]
    кратність: одне
    джерело: [фото, крамниця]
    у_рядку: так
    значення:
      круглий: "круглий | півколо"
      мигдаль: "мигдаль | звужений із заокругленим кінцем"
      гострий: "гострий | кінець гострий"
      квадратний: "квадратний | прямий кінець"
      відкритий: "відкритий | видно пальці"
  п'ята:
    назва: п'ята
    означення: Що тримає п'яту.
    де: [взуття]
    кратність: одне
    джерело: [фото, крамниця]
    у_рядку: так, якщо не закрита
    значення:
      закрита: "закрита | задник"
      ремінець: "ремінець | ремінець за п'ятою"
      відкрита: "відкрита | нічого не тримає п'яту"

  ремінці_взуття:
    назва: ремінці
    означення: Ремінці, що тримають стопу поверх закритого верху чи замість нього, — де проходять (ремінець за п'ятою — поле «п'ята»).
    де: [взуття]
    кратність: кілька
    джерело: [фото, крамниця]
    у_рядку: так, якщо є
    значення:
      між_пальцями: "між пальцями | ремінець виходить з підошви між першим і другим пальцем; від «над пальцями» — проходить між пальців, а не поперек"
      над_пальцями: "над пальцями | ремінець чи смуга лежить поперек пальців; від «через підйом» — ближче до носка, ніж до щиколотки"
      через_підйом: "через підйом | поперечний ремінець на середині стопи; від «навколо щиколотки» — не охоплює ногу над п'ятковою кісткою"
      перехресні: "перехресні | кілька ремінців перетинаються над стопою; від решти — видно перехрестя"
      т_подібний: "Т-подібний | поздовжній ремінець від носка до щиколотки з'єднаний з поперечним; від «через підйом» — є поздовжній"
      навколо_щиколотки: "навколо щиколотки | ремінець замкнений довкола ноги над п'ятковою кісткою; від «через підйом» — вище за стопу"

  виріз_взуття:
    назва: виріз взуття
    означення: Наскільки й якою лінією верх взуття відкриває підйом стопи.
    де: [взуття]
    кратність: одне
    джерело: [фото]
    невідомо: взуття видно лише збоку чи ззаду
    у_рядку: так, якщо не закритий
    склад:
      глибина:
        значення:
          закритий: "закритий | верх закриває підйом до щиколотки чи шнурівки; від помірного — шкіри підйому не видно"
          помірний: "помірний | край верху перетинає підйом, видно його нижню частину; від глибокого — основи пальців не видно"
          глибокий: "глибокий | край верху спускається до основи пальців, видно щілину між ними; від помірного — видно основу пальців"
          без_верху: "без верху | суцільного верху нема, стопу тримають ремінці; від глибокого — нема суцільного носка"
      форма:
        значення:
          округла: "округла | край вирізу — дуга; від гострої — без кута посередині"
          гостра: "гостра | край сходиться кутом до носка; від округлої — видно кут"
          пряма: "пряма | край — пряма поперек стопи; від округлої — без вигину"
          асиметрична: "асиметрична | один бік вирізу нижчий за інший; від решти — лінія не дзеркальна"

  форма_сумки:
    назва: форма сумки
    означення: Обрис корпусу сумки спереду.
    де: [сумка]
    кратність: одне
    джерело: [фото]
    у_рядку: так
    значення:
      горизонтальна: "горизонтальна | прямокутник ширший за висоту"
      вертикальна: "вертикальна | прямокутник вищий за ширину"
      квадратна: "квадратна | сторони приблизно рівні"
      трапеція: "трапеція | розширюється донизу"
      півмісяць: "півмісяць | вигнута дуга"
      кругла: "кругла | коло чи овал"
      циліндр: "циліндр | бочка лежачи чи стоячи"
      мішечок: "мішечок | м'який із затяжкою"
      конверт: "конверт | плаский прямокутник із клапаном на всю ширину"
  розмір_сумки:
    назва: розмір сумки
    означення: Розмір корпусу.
    де: [сумка]
    кратність: одне
    джерело: [крамниця, фото]
    у_рядку: так
    значення:
      міні: "міні | менша за телефон"
      мала: "мала | до ~25 см"
      середня: "середня | ~25–35 см, аркуш A4 не входить"
      велика: "велика | аркуш A4 входить"
  ручки:
    назва: ручки
    означення: Чим сумку носять — вид, скільки, чи знімне.
    де: [сумка]
    кратність: кілька
    джерело: [фото, крамниця]
    у_рядку: "ні — у рядок іде виведене «як носять»"
    склад:
      вид:
        значення:
          коротка: "коротка ручка | у руці чи на згині ліктя"
          плечова: "плечова | на плечі під пахвою"
          довга: "довгий ремінь | через плече"
          ланцюжок: "ланцюжок | ланцюжок-ручка"
      скільки: {список: кількість}
      знімна:
        значення:
          так: "так | знімна"
          ні: "ні | постійна"

  поля_убору:
    назва: поля
    означення: Ширина полів головного убору.
    де: [головний_убір]
    кратність: одне
    джерело: [фото]
    у_рядку: так, якщо є
    значення:
      немає: "немає | без полів"
      вузькі: "вузькі | до ~5 см"
      середні: "середні | ~5–10 см"
      широкі: "широкі | понад ~10 см"

  ширина_шарфа:
    назва: ширина шарфа
    означення: Ширина полотна шарфа.
    де: [шарф]
    кратність: одне
    джерело: [крамниця, фото]
    у_рядку: так
    значення:
