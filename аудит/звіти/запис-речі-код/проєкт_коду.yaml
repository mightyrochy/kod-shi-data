# Проєкт коду речі — джерело правди для КАРТКИ.md, ПРИКЛАДИ.md і перевірки мірил (скрипти/перевірка.py).
# Значення закритого переліку записано як «код: "назва | межа з сусідами"». Межа — видима ознака на фото
# або сказана ознака в словах крамниці; для виведених полів межа — правило виводу.
# Документ, не код продукту: ядро цього файлу не читає.

про: >-
  Проєкт коду речі для кореня Річ-запис-речі (наряд Запис-речі-проєкт-коду, 28.11). Запис речі — набір фактів
  {значення, джерело}; значення — лише з закритого переліку поля, число в названих одиницях або один зі станів.
  Кожне поняття має одну шкалу для всіх видів речей; прізвиська (футляр, джинси, тренч, челсі, костюм…) не
  кодує модель, їх виводить код із виду й полів.

стани:
  невідомо: "джерела мовчать: на фото ознаки не видно, крамниця про неї не каже, вивести нема з чого"
  не_стосується: "поле не має сенсу для цього виду (каблук у сумки, рукав у спідниці); ставить код за полем «де», модель не пише"
  не_певний: "джерело є, але ознака на межі двох сусідніх значень або фото й крамниця кажуть різне; пишеться перелік 2–3 кандидатів, не одне значення"
  немає: "ознаку видно чи сказано, і її нема (без малюнка, без застібки, без підкладки) — це значення, не «невідомо»"

джерела:
  фото: "видно на фото речі: на тілі, на манекені чи предметно"
  крамниця: "сказано в назві, параметрах чи описі крамниці"
  код: "виводить код з інших полів чи з мірок крамниці; модель це поле не пише"

місця: [верх, низ, сукня, комплект, верхній_шар, взуття, сумка, головний_убір, шарф, пояс, сережки, кольє, браслет, каблучка, брошка, волосся, інше]
групи:
  одяг: [верх, низ, сукня, комплект, верхній_шар]
  прикраси: [сережки, кольє, браслет, каблучка, брошка, волосся]
  текстиль: [верх, низ, сукня, комплект, верхній_шар, головний_убір, шарф, пояс, сумка, взуття, волосся]

