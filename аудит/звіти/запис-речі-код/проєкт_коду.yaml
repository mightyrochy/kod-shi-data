      занижена: "занижена | на стегнах"
      без: "без | лінії талії нема"

  посадка:
    назва: посадка
    означення: Де верхній край низу.
    де: [низ, комплект]
    кратність: одне
    джерело: [фото, крамниця]
    невідомо: пояс закрито верхом
    ядро: посадка (rise)
    у_рядку: так
