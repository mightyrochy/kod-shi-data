    плече: "плече | закриває лише плечовий суглоб (кап, крильце); вище середини плеча"
    вище_ліктя: "вище ліктя | між серединою плеча й ліктем"
    лікоть: "лікоть | на лікті, не далі як на півдолоні від нього"
    нижче_ліктя: "нижче ліктя (три чверті) | між ліктем і зап'ястям, далі як на долоню від зап'ястя"
    зап'ястя: "зап'ястя | на зап'ясті чи на долоню вище нього"
    кисть: "кисть | закриває частину кисті (подовжений)"

списки:
  мотив:
    смуги: "смуги | лінії одного напрямку; від клітинки — не перетинаються"
    клітинка: "клітинка | лінії двох напрямків перетинаються (шотландка, гусяча лапка, віші); від геометричного — сітка ліній, не фігури"
    горох: "горох | однакові круглі цятки рівним кроком; від геометричного — лише кола"
    квітковий: "квітковий | є квітки чи пелюстки; від рослинного — є квітка"
    рослинний: "рослинний | листя, гілки, плоди, пір'я без квітки"
    під_шкіру_тварини: "під шкіру тварини | наслідує впізнаване хутро чи шкіру тварини (леопард, зебра, змія, крокодил); від абстрактного — тварину названо крамницею чи її легко впізнати"
    тварини: "тварини | фігури тварин, птахів, комах цілком; від «під шкіру тварини» — видно саму тварину"
    геометричний: "геометричний | правильні фігури (ромби, трикутники, кола різного розміру, хвилі) з повтором; від абстрактного — фігури правильні й повторюються"
    абстрактний: "абстрактний | плями й мазки неправильної форми без впізнаваного предмета"
    орнамент: "орнамент | традиційний народний чи етнічний візерунок (вишиванковий, пейслі, ікат); від геометричного — впізнаваний традиційний мотив чи так каже крамниця"
    камуфляж: "камуфляж | плями захисних відтінків військового зразка; від абстрактного — військова гама й форма плям"
    статутний: "статутний камуфляж | зразок військової форми — піксель (ММ-14, ММ-16) чи мультикам, названий крамницею чи впізнаваний; від «камуфляж» — зразок форми, а не модний мотив"
    монограма: "монограма | повторювані літери чи знак бренду як візерунок; від напису — без читабельного тексту, знак повторюється"
    напис: "напис | читабельне слово чи фраза"
    серця: "серця | серця як головний мотив"
    зірки: "зірки | зірки як головний мотив"
    бант: "бант | бант як форма чи мотив"
    фігуративний: "фігуративний | люди, предмети, пейзажі, сцени; від тварин і рослин — інший предмет"
  зона:
    горловина: "горловина | край вирізу чи комір"
    плечі: "плечі | від шиї до плечового шва"
    рукави: "рукави | рукав від плеча до манжета, без манжета"
