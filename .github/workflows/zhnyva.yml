# Жнива за рецептами (виконавець.py) з серверів GitHub — запуск із телефона: Actions → «жнива» → Run workflow.
# Журнал сирих HTML карток, наявні API-записи, черга й звіти — RUNNER_TEMP → artifact цього workflow/ref (30 днів).
# Давню гілку zhnyva-data не змінюємо й не приймаємо як новий checkpoint. Копій кадрів тут немає.
# Магазини з транспортом «дім» тут не беруться: python3 виконавець.py --транспорт дім на ноутбуці.
name: жнива

on:
  workflow_dispatch:
    inputs:
      shops:
        description: "усі — або домени через кому"
        type: string
        default: усі
      transport:
        description: "http,браузер (з дата-центру) — не змінювати без потреби"
        type: string
        default: "http,браузер"
      ceiling:
        description: "карток на магазин за запуск"
        type: string
        default: "300"
      seconds:
        description: "бюджет секунд на магазин"
        type: string
        default: "900"
      parallel:
        description: "магазинів одночасно (1–4)"
        type: string
        default: "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: zhnyva
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: 'python3 -m pip install --quiet --only-binary=:all: --require-hashes -r .github/requirements/жнива.txt'
      - run: python3 -m playwright install --with-deps chromium
      - name: відновити журнал цього workflow/ref поза git
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 zhnyvarka/журнал_артефакт.py
      - name: жнива
        id: harvest
        working-directory: zhnyvarka
        env:
          JOURNAL_ROOT: ${{ runner.temp }}/жнива-журнал
          HARVEST_SHOPS: ${{ inputs.shops }}
          HARVEST_TRANSPORT: ${{ inputs.transport }}
          HARVEST_CEILING: ${{ inputs.ceiling }}
          HARVEST_SECONDS: ${{ inputs.seconds }}
          HARVEST_PARALLEL: ${{ inputs.parallel }}
        run: |
          set -euo pipefail
          python3 виконавець.py --журнал "$JOURNAL_ROOT" --без-огляду --рецепти рецепти.tsv \
            --магазини "$HARVEST_SHOPS" --транспорт "$HARVEST_TRANSPORT" \
            --стеля "$HARVEST_CEILING" --секунд-на-магазин "$HARVEST_SECONDS" --паралельно "$HARVEST_PARALLEL" \
            2>&1 | tee "$JOURNAL_ROOT/жнива_лог.txt"
          cat "$JOURNAL_ROOT/зведення_жнив.tsv"
      - name: діагностика каталогу після жнив
        if: always()
        continue-on-error: true
        run: |
          # Цей виконавець не складає нового каталогу: вимір позначено як знімок checkout.
          python3 джерела/прилади/звіт_після_жнив.py --вихід zhnyvarka \
            --каталог каталог_повний.xml.gz --стан "${{ steps.harvest.outcome }}; каталог — знімок checkout"
      - name: зберегти діагностику прогону
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zhnyva-diagnostics
          path: |
            zhnyvarka/діагностика_каталогу.*
            zhnyvarka/звіт_жнив.md
          if-no-files-found: warn
          retention-days: 30
      - name: зберегти журнал і частковий прогрес поза git
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.restore.outputs.artifact }}
          path: |
            ${{ runner.temp }}/жнива-журнал/ідентичність.json
            ${{ runner.temp }}/жнива-журнал/проходи/
            ${{ runner.temp }}/жнива-журнал/сирі/
            ${{ runner.temp }}/жнива-журнал/зведення_жнив.tsv
            ${{ runner.temp }}/жнива-журнал/жнива_лог.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
