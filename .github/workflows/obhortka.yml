name: стенди обгортки

on:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'аудит/адаптери/gemini/**'
      - 'аудит/проби/перевірити_нічний_маркер.ps1'
      - 'аудит/наряди/автоживий.md'
      - 'аудит/проби/доробка_менше_прогонів.py'
      - 'аудит/проби/поставити_нічну_позначку.py'
      - '.github/workflows/obhortka.yml'
  push:
    branches: [main]
    paths:
      - 'аудит/адаптери/gemini/**'
      - 'аудит/проби/перевірити_нічний_маркер.ps1'
      - 'аудит/наряди/автоживий.md'
      - 'аудит/проби/доробка_менше_прогонів.py'
      - 'аудит/проби/поставити_нічну_позначку.py'
      - '.github/workflows/obhortka.yml'

permissions:
  contents: read

concurrency:
  group: стенди-обгортки-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nichna_poznachka:
    name: довірений дозвіл нічного прогону
    if: github.event_name == 'schedule' && github.repository == 'mightyrochy/kod-shi-data'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: датована гілка черги без пересування наявної
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 аудит/проби/поставити_нічну_позначку.py

  obhortka:
    if: github.event_name != 'schedule'
    name: обгортка — Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PWSH: ''
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: LF для Git Bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Git Bash і Windows PowerShell 5.1
        run: |
          set -euo pipefail
          command -v cygpath
          [ "$(powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString(2)' | tr -d '\r')" = 5.1 ]
          # ASCII-шлях спільних .cmd-заглушок; PWSH з Bypass створить середовище.sh.
          echo "TMPDIR=$(cygpath -u "$RUNNER_TEMP")/obhortka" >> "$GITHUB_ENV"
          mkdir -p "$(cygpath -u "$RUNNER_TEMP")/obhortka"

      - name: усі стенди обгортки, нічний стенд і хеші
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python аудит/проби/доробка_менше_прогонів.py --дерево . --журнали "$RUNNER_TEMP/obhortka-logs" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
