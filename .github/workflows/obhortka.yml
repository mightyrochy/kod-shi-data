name: стенди обгортки

on:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'аудит/адаптери/gemini/**'
      - 'аудит/проби/перевірити_нічний_маркер.ps1'
      - 'аудит/наряди/автоживий.md'
      - 'аудит/проби/доробка_менше_прогонів.py'
      - 'аудит/проби/поставити_нічну_позначку.py'
      - '.github/workflows/obhortka.yml'
  push:
    branches: [main]
    paths:
      - 'аудит/адаптери/gemini/**'
      - 'аудит/проби/перевірити_нічний_маркер.ps1'
      - 'аудит/наряди/автоживий.md'
      - 'аудит/проби/доробка_менше_прогонів.py'
      - 'аудит/проби/поставити_нічну_позначку.py'
      - '.github/workflows/obhortka.yml'

permissions:
  contents: read

concurrency:
  group: стенди-обгортки-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nichna_poznachka:
    name: довірений дозвіл нічного прогону
    if: github.event_name == 'schedule' && github.repository == 'mightyrochy/kod-shi-data'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: датована гілка черги без пересування наявної
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 аудит/проби/поставити_нічну_позначку.py

  obhortka_parts:
    if: github.event_name != 'schedule'
    name: обгортка — частина ${{ matrix.part }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            stands:
              - 'сценарії_рушіїв.sh'
          - part: 2
            stands:
              - 'сценарії_claude.sh'
              - 'сценарії_менше_прогонів.ps1'
              - 'перевірити_нічний_маркер.ps1'
              - 'сценарії_тихі_пробудження.ps1'
              - 'сценарії_простій.ps1'
          - part: 3
            stands:
              - 'сценарії_смуг.sh'
              - 'сценарії_спостерігача.sh'
              - 'сценарії_копії.ps1'
              - 'сценарії_здоровя.sh'
              - 'сценарії_межі_здоровя.ps1'
              - 'сценарії_живий_рядок.ps1'
              - 'перевірити_хеші.py'
          - part: 4
            stands:
              - 'сценарії_прогону.sh'
              - 'сценарії_доставки.sh'
              - 'сценарії_бандлів.sh'
              - 'сценарії_простій_ресурсу.ps1'
              - 'сценарії_m9v.sh'
              - 'сценарії_gpu_процеси.ps1'
              - 'сценарії_no_report.ps1'
          - part: 5
            stands:
              - 'сценарії_черги.sh'
              - 'сценарії_ланцюга.sh'
              - 'сценарії_коду_збірки.ps1'
              - 'сценарії_живих_pr.sh'
              - 'сценарії_самооновлення.sh'
              - 'сценарії_кінець_роботи.ps1'
              - 'сценарії_кінця_позначки.ps1'
              - 'сценарії_звіту.sh'
              - 'сценарії_gpu_память.ps1'
    defaults:
      run:
        shell: bash
    env:
      PWSH: ''
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: LF для Git Bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Git Bash і Windows PowerShell 5.1
        run: |
          set -euo pipefail
          command -v cygpath
          [ "$(powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString(2)' | tr -d '\r')" = 5.1 ]
          # ASCII-шлях спільних .cmd-заглушок; PWSH з Bypass створить середовище.sh.
          echo "TMPDIR=$(cygpath -u "$RUNNER_TEMP")/obhortka" >> "$GITHUB_ENV"
          mkdir -p "$(cygpath -u "$RUNNER_TEMP")/obhortka"

      - name: частина стендів обгортки
        if: ${{ !cancelled() }}
        env:
          STANDS: ${{ join(matrix.stands, ' ') }}
        run: |
          set -o pipefail
          read -r -a stands <<< "$STANDS"
          python аудит/проби/доробка_менше_прогонів.py --дерево . --журнали "$RUNNER_TEMP/obhortka-logs" --лише "${stands[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: результати частини
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obhortka-${{ matrix.part }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/obhortka-logs/результати.json
            ${{ runner.temp }}/obhortka-logs/*.log

  obhortka:
    name: обгортка — Windows PowerShell 5.1
    needs: obhortka_parts
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: obhortka-*
          path: ${{ runner.temp }}/obhortka-results
      - name: усі стенди виконані рівно раз і зелені
        if: ${{ !cancelled() }}
        env:
          PARTS_RESULT: ${{ needs.obhortka_parts.result }}
        run: |
          set -o pipefail
          python3 аудит/проби/доробка_менше_прогонів.py --дерево . --журнали "$RUNNER_TEMP/obhortka-results" --зібрати 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          test "$PARTS_RESULT" = success
