# Самозлиття документа й коду (ядро, «Документ без коду»; договір диспетчера, «Злиття»).
# Після CI, рецензії, відповіді в треді, зняття чернетки або мітки «злити» прилад з main обходить відкриті PR до main.
# Спільне: автор mightyrochy, гілка цього репозиторію (крім copilot/…), PR готовий до рецензії, перевірки SHA голови
# завершені з success/skipped. Документ зливається за переліком шляхів. Код — за рецензією Copilot на цій голові,
# розібраними тредами Codex і Copilot та файлами поза закритими місцями. Причина відмови — у підсумку job.
# Мітка «злити» від mightyrochy, зафіксована на зеленому SHA, лишає диспетчерові шлях злиття коду. Нова голова робить
# мітку застарілою (дошка 17101). «Рішення» і «злиття» беруть лише прилад з main; рецензії, треди й файли PR — з API.
# Події рецензій приходять з окремого сигналу без checkout і прав. Дані цього запуску лише будять рішення.
# Злиття — squash з очікуваним SHA. Злиття токеном CI не будить push, тож крок сам викликає zbirka.yml з main до
# злиття (pered) і комітом злиття (pislia); для коду — повний шлях (kod: true).
name: самозлиття документа

on:
  workflow_run:
    workflows: [збірка показу, рядок ЖИВИЙ ПІСЛЯ у тілі PR, стенди обгортки, рецензія для самозлиття]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [labeled, ready_for_review]

permissions: {}

# Черга — на рівні job, не процесу (наряд CI-самозлиття-черга, 15.11). Група процесу трималась і на час робочих процесів
# `main` після злиття: 15.11 запуск 43717653213 злив PR о 13:31 і тримав її до 15:12 — його job викликаних процесів
# чекали раннерів 8–51 хв за десятками збірок PR, а 190 запусків від PR за 13:02–15:14 GitHub скасував у черзі, і
# жоден документ не злився сам. Тепер групу тримають лише `рішення` (своя) і `злиття` (своя) — по хвилині; job після
# злиття — поза групами самозлиття (у своїх групах викликаних процесів). У кожній групі один запущений і один
# очікуваний, новіший очікуваний витісняє старший. Очікуване `рішення` — завжди найновіше, тож після кожного
# завершення CI на PR рішення стартує не раніше нього й обходить усі відкриті PR. `злиття` йде в порядку рішень
# (`рішення` по одному), тож витісняє старше злиття лише злиття з новішим рішенням; кандидата, якого вже злито чи
# змінено, `--злити` пропускає (стан, чернетка й голова звіряються перед злиттям). Запуск від `push` групи не займає:
# `рішення` пропущено умовою, решту — за `needs`.

jobs:
  # Фіксація мітки на SHA голови (дошка 17101, доробка #4718): у момент `labeled` (сніпшот події — голова саме тоді)
  # ставимо на цей SHA статус; прилад вважає мітку чинною, лише коли такий статус є на ПОТОЧНІЙ голові. Новий коміт —
  # іншого SHA статуса нема, мітка стара; дат коміту й запусків CI мітка не звіряє. Єдиний запис — статус коміту й лише
  # коли мітку поставив `mightyrochy`; коду PR job не бере (нема checkout), значення йдуть через env.
  # Job іде завжди, а умова — на кроці: пропущений job пропускав би залежні `рішення`, `злиття` й `збірку` (неявний
  # `success()` переносить пропуск предка далі ланцюгом; доробка #4718), і документи без мітки не зливались би.
  mitka:
    name: мітка
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: статус «мітка» на SHA голови
        if: github.event_name == 'pull_request_target' && github.event.label.name == 'злити' && github.event.sender.login == 'mightyrochy'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=success \
            -f context='самозлиття: мітка «злити»' -f description='мітка поставлена на цю голову'

  rishennia:
    name: рішення
    needs: mitka
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review' || github.event.workflow_run.event == 'pull_request_review_comment' || (github.event_name == 'pull_request_target' && github.event.label.name == 'злити') || github.event.action == 'ready_for_review'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
      statuses: read
    concurrency:
      group: самозлиття-рішення
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kandydaty: ${{ steps.rishennia.outputs.kandydaty }}
      stari: ${{ steps.rishennia.outputs.stari }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            джерела/прилади/документ_без_коду.py
            джерела/прилади/запуск_python.py
          sparse-checkout-cone-mode: false

      - name: відкриті PR → кандидати
        id: rishennia
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I джерела/прилади/документ_без_коду.py --рішення

  zlyttia:
    name: злиття
    needs: rishennia
    if: (needs.rishennia.outputs.kandydaty != '' && needs.rishennia.outputs.kandydaty != '[]') || (needs.rishennia.outputs.stari != '' && needs.rishennia.outputs.stari != '[]')
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: самозлиття-документа
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      zlyto: ${{ steps.zlyttia.outputs.zlyto }}
      kod: ${{ steps.zlyttia.outputs.zlyto_kod }}
      zlyti: ${{ steps.zlyttia.outputs.zlyti }}
      pered: ${{ steps.zlyttia.outputs.pered }}
      pislia: ${{ steps.zlyttia.outputs.pislia }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            джерела/прилади/документ_без_коду.py
            джерела/прилади/запуск_python.py
          sparse-checkout-cone-mode: false

      - name: squash з sha голови
        id: zlyttia
        env:
          GH_TOKEN: ${{ github.token }}
          KANDYDATY: ${{ needs.rishennia.outputs.kandydaty }}
          STARI: ${{ needs.rishennia.outputs.stari }}
        run: python3 -I джерела/прилади/документ_без_коду.py --злити

  # Робочі процеси `main`, які будить push злиття: згортання дошки й публікація.
  # `стенди обгортки` документ не будить (його шляхи для приладу — «ні»; звіряє тест приладу).
  zbirka:
    name: збірка показу після злиття
    needs: zlyttia
    if: needs.zlyttia.outputs.zlyto == 'true'
    # Межа — права всіх job викликаного процесу: публікація, пошук перевіреного дерева й погодження живого. Вужча межа —
    # startup_failure всього процесу без жодного job, навіть коли job викликаного пропущено умовою.
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/zbirka.yml
    with:
      pered: ${{ needs.zlyttia.outputs.pered }}
      pislia: ${{ needs.zlyttia.outputs.pislia }}
      kod: ${{ needs.zlyttia.outputs.kod == 'true' }}
      zlyti: ${{ needs.zlyttia.outputs.zlyti }}
