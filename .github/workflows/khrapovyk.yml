# Храповик кореня: число місць кореня (паспорт `аудит/корені/<корінь>.md`, рядок `прилад:`) на голові не вище, ніж
# на базі; прилад чи його `база:` — окремим PR від коду `джерела/` і `показ/`. Формат паспорта — `аудит/КОД.md`.
# Окремий workflow, а не job `zbirka.yml`: push у main там іде лише за `paths` (паспорт, наряд чи дошка його не
# будять), а тут — кожен PR і кожен push у main; легкий checkout глибини 1, без збірки показу.
name: храповик кореня

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Виклик із кроку самозлиття документа (`samozlyttia.yml`): злиття токеном CI не будить `push`, тож крок викликає
  # цей процес сам. `pislia` — коміт злиття на `main`, `pered` — `main` до злиття (замість `github.event.before`).
  workflow_call:
    inputs:
      pered:
        type: string
        required: true
      pislia:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: храповик-кореня-${{ github.event_name == 'pull_request' && github.ref || inputs.pislia || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  khrapovyk:
    permissions:
      contents: read
    name: храповик кореня
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ inputs.pislia }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Документний PR (наряд CI-час-злиття-2): усі змінені файли — у теках `аудит/<тека>/`, крім `корені`, `проби` й
      # `адаптери`, — храповик не лічить: жоден прилад кореня не читає наряди, дошку, перевірки, передачі (обсяг —
      # шляхи в коді приладів і помічників; `корінь_е2_промпти.py` обходить корінь репозиторію, крім `аудит`, `.github`,
      # `.claude`, і ще `аудит/проби`; ПК-прилади — файли правил у корені й верхньому рівні `аудит/`). Тоді — зелений
      # пропуск тим самим джобом. Невідомий дифф (не коміт злиття) і push у `main` — лічба, як була.
      - name: чи зачіпає PR лічене храповиком
        id: obsiah
        if: github.event_name == 'pull_request'
        run: |
          lichyty=true
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            lichyty=false
            while IFS= read -r -d '' shliakh; do
              case "${shliakh}" in
                аудит/корені/*|аудит/проби/*|аудит/адаптери/*) lichyty=true ;;
                аудит/*/*) ;;
                *) lichyty=true ;;
              esac
            done < <(git -c core.quotepath=off diff --name-only --no-renames -z HEAD^1 HEAD)
          fi
          echo "lichyty=${lichyty}" >> "$GITHUB_OUTPUT"
          if [ "${lichyty}" = false ]; then
            echo "Храповик кореня: PR міняє лише записи \`аудит/\` поза коренями, пробами й адаптерами — пропуск, місць не лічено." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PR — коміт злиття проти свого першого батька (той `main`, з яким злито; глибини 2 досить): `base.sha` давній,
      # якщо PR влив свіжий `main`, і дав би чужі файли (дошка 11353). Не злиття — `base.sha`. Push — проти
      # `event.before`. Ручний запуск бази не має: прилад друкує пропуск (дошка 10720).
      - name: храповик кореня
        id: khrapovyk
        if: steps.obsiah.outputs.lichyty != 'false'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.pered || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 джерела/прилади/храповик_кореня.py --пр --база "${BASE}" --ознака-стенда "$GITHUB_OUTPUT"
            exit
          fi
          if [ -n "${BASE//0/}" ]; then
            git fetch --no-tags --depth=1 origin "${BASE}" || echo "базу ${BASE} не отримано з origin"
          fi
          python3 джерела/прилади/храповик_кореня.py --база "${BASE}" --ознака-стенда "$GITHUB_OUTPUT"

      - name: стенд храповика (випадки мірила)
        if: ${{ !cancelled() && steps.obsiah.outputs.lichyty != 'false' && steps.khrapovyk.outputs['стенд'] != 'false' }}
        run: |
          set -o pipefail
          python3 джерела/прилади/стенд_храповика_кореня.py | tee -a "$GITHUB_STEP_SUMMARY"
