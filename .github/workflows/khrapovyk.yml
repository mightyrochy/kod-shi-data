# Храповик кореня: число місць кореня (паспорт `аудит/корені/<корінь>.md`, рядок `прилад:`) на голові не вище, ніж
# на базі; прилад чи його `база:` — окремим PR від коду `джерела/` і `показ/`. Формат паспорта — `аудит/КОД.md`.
# Окремий workflow, а не job `zbirka.yml`: push у main там іде лише за `paths` (паспорт, наряд чи дошка його не
# будять), а тут — кожен PR і кожен push у main; легкий checkout глибини 1, без збірки показу.
name: храповик кореня

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Виклик із кроку самозлиття документа (`samozlyttia.yml`, #3585): злиття токеном CI не будить `push`, тож крок викликає
  # цей процес сам. `pislia` — коміт злиття на `main`, `pered` — `main` до злиття (замість `github.event.before`).
  workflow_call:
    inputs:
      pered:
        type: string
        required: true
      pislia:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: храповик-кореня-${{ github.event_name == 'pull_request' && github.ref || inputs.pislia || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  khrapovyk:
    permissions:
      contents: read
    name: храповик кореня
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ inputs.pislia }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Документний PR (наряд CI-час-злиття-2): усі змінені файли — у теках `аудит/<тека>/`, крім `корені`, `проби` й
      # `адаптери`, — храповик не лічить: жоден прилад кореня не читає наряди, дошку, перевірки, передачі (обсяг —
      # шляхи в коді приладів і помічників; `корінь_е2_промпти.py` обходить корінь репозиторію, крім `аудит`, `.github`,
      # `.claude`, і ще `аудит/проби`; ПК-прилади — файли правил у корені й верхньому рівні `аудит/`). Тоді — зелений
      # пропуск тим самим джобом. Невідомий дифф (не коміт злиття) і push у `main` — лічба, як була.
      - name: чи зачіпає PR лічене храповиком
        id: obsiah
        if: github.event_name == 'pull_request'
        run: |
          lichyty=true
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            lichyty=false
            while IFS= read -r -d '' shliakh; do
              case "${shliakh}" in
                аудит/корені/*|аудит/проби/*|аудит/адаптери/*) lichyty=true ;;
                аудит/*/*) ;;
                *) lichyty=true ;;
              esac
            done < <(git -c core.quotepath=off diff --name-only --no-renames -z HEAD^1 HEAD)
          fi
          echo "lichyty=${lichyty}" >> "$GITHUB_OUTPUT"
          if [ "${lichyty}" = false ]; then
            echo "Храповик кореня: PR міняє лише записи \`аудит/\` поза коренями, пробами й адаптерами — пропуск, місць не лічено." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PR — коміт злиття проти свого першого батька (той `main`, з яким злито; глибини 2 досить): `base.sha` давній,
      # якщо PR влив свіжий `main`, і дав би чужі файли (дошка 11353). Не злиття — `base.sha`. Push — проти
      # `event.before`. Ручний запуск бази не має: прилад друкує пропуск (дошка 10720).
      - name: храповик кореня
        id: khrapovyk
        if: steps.obsiah.outputs.lichyty != 'false'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.pered || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 джерела/прилади/храповик_кореня.py --пр --база "${BASE}" --ознака-стенда "$GITHUB_OUTPUT"
            exit
          fi
          if [ -n "${BASE//0/}" ]; then
            git fetch --no-tags --depth=1 origin "${BASE}" || echo "базу ${BASE} не отримано з origin"
          fi
          python3 джерела/прилади/храповик_кореня.py --база "${BASE}" --ознака-стенда "$GITHUB_OUTPUT"

      # Стенди й самоперевірки приладів коренів (`тест_корінь_*.py`, `корінь_*.py --самоперевірка`; рядки дошки 16041,
      # 16089): раніше CI лише компілював їх, і хибне місце приладу проходило, коли випадку нема. Крок іде, коли PR чіпає
      # `джерела/прилади/` чи цей workflow; діф, якого не розібрано (не коміт злиття), — іде. Перелік бере запускач з файлів.
      - name: чи зачіпає PR прилади коренів
        id: prylady
        if: github.event_name == 'pull_request'
        run: |
          zapusk=true
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            zapusk=false
            while IFS= read -r -d '' shliakh; do
              case "${shliakh}" in
                джерела/прилади/*|.github/workflows/khrapovyk.yml) zapusk=true ;;
              esac
            done < <(git -c core.quotepath=off diff --name-only --no-renames -z HEAD^1 HEAD)
          fi
          echo "zapusk=${zapusk}" >> "$GITHUB_OUTPUT"

      - name: стенди й самоперевірки приладів коренів
        if: ${{ !cancelled() && steps.prylady.outputs.zapusk == 'true' }}
        run: |
          # Перелік — glob за файлами. Запуск з кореня репозиторію й без `-I`: прилади імпортують сусідні модулі зі своєї теки.
          # Усе виконується до кінця; впалі названо наприкінці, код кроку 1, коли впав хоч один чи перелік порожній.
          shopt -s nullglob
          stendy=(джерела/прилади/тест_корінь_*.py)
          samoperevirky=()
          for prylad in джерела/прилади/корінь_*.py; do
            if grep -q -- '--самоперевірка' "${prylad}"; then samoperevirky+=("${prylad}"); fi
          done
          zhurnal="${RUNNER_TEMP}/stendy_koreniv.log"
          : > "${zhurnal}"
          vpaly=()
          vykonaty() {
            local vyd="$1" fail="$2" poch kod
            shift 2
            poch=${SECONDS}
            vyvid=$(timeout 900 python3 "${fail}" "$@" 2>&1) && kod=0 || kod=$?
            if [ "${kod}" -eq 0 ]; then
              echo "ОК   ${vyd}: ${fail}, $((SECONDS - poch)) с" | tee -a "${zhurnal}"
            else
              echo "ВПАВ ${vyd}: ${fail}, код ${kod}, $((SECONDS - poch)) с" | tee -a "${zhurnal}"
              printf '%s\n' "${vyvid}" | tail -n 12 | cut -c1-200 | sed 's/^/    | /' | tee -a "${zhurnal}"
              vpaly+=("${vyd} ${fail} (код ${kod})")
            fi
          }
          pochatok=${SECONDS}
          for fail in "${stendy[@]}"; do vykonaty стенд "${fail}"; done
          for fail in "${samoperevirky[@]}"; do vykonaty самоперевірка "${fail}" --самоперевірка; done
          pidsumok="виконано стендів ${#stendy[@]}, самоперевірок ${#samoperevirky[@]}, за $((SECONDS - pochatok)) с; впало ${#vpaly[@]}"
          echo "---" | tee -a "${zhurnal}"
          echo "${pidsumok}" | tee -a "${zhurnal}"
          for vpav in "${vpaly[@]}"; do echo "  впав: ${vpav}" | tee -a "${zhurnal}"; done
          { echo '```'; cat "${zhurnal}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $((${#stendy[@]} + ${#samoperevirky[@]})) -eq 0 ]; then echo "перелік порожній — не зелений"; exit 1; fi
          if [ "${#vpaly[@]}" -ne 0 ]; then exit 1; fi

      - name: стенд храповика (випадки мірила)
        if: ${{ !cancelled() && steps.obsiah.outputs.lichyty != 'false' && steps.khrapovyk.outputs['стенд'] != 'false' }}
        run: |
          set -o pipefail
          python3 джерела/прилади/стенд_храповика_кореня.py | tee -a "$GITHUB_STEP_SUMMARY"
