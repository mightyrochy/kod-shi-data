# Жниварка на серверах GitHub — без ноутбука. Запуск із телефона: репозиторій → Actions → «жниварка»
# → Run workflow → режим → Run. Результат комітиться в zhnyvarka/жнива_проба/ (проба) або zhnyvarka/жнива/ (повний).
# Джерела беруться з zhnyvarka/ (та сама тека, з якої оновлюється ноутбук). Кореневий каталог_повний.xml не чіпається.
name: жниварка

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "проба (3 картки з магазину, ~10 хв) чи повний (до 6 год, 6 паралельних завдань)"
        type: choice
        options: [проба, повний]
        default: проба
      shops:
        description: "усі — або домени через кому, напр. gepur.com,vovk.com"
        type: string
        default: усі
      cap:
        description: "стеля карток на магазин (повний)"
        type: string
        default: "2500"
      groups:
        description: "паралельних завдань 1–8"
        type: string
        default: "6"

permissions:
  contents: read

concurrency:
  group: zhnyvarka
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.g.outputs.groups }}
    steps:
      - id: g
        run: |
          n="${{ inputs.groups }}"; case "$n" in ''|*[!0-9]*) n=6;; esac
          if [ "${{ inputs.mode }}" = "проба" ]; then n=1; fi
          echo "groups=$(python3 -c "import json,sys;n=int(sys.argv[1]);print(json.dumps(['%d/%d'%(i,n) for i in range(1,n+1)]))" "$n")" >> "$GITHUB_OUTPUT"

  harvest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: 'python3 -m pip install --quiet --only-binary=:all: --require-hashes -r .github/requirements/жниварка.txt'
      - name: жнива
        working-directory: zhnyvarka
        run: |
          set -o pipefail
          if [ "${{ inputs.mode }}" = "повний" ]; then
            python3 жниварка.py --режим повний --магазини "${{ inputs.shops }}" --група "${{ matrix.group }}" \
              --стеля "${{ inputs.cap }}" --потоки 4 --фото-кожен 5 --дедлайн-хвилин 80 --хвилин-на-магазин 0 --вихід жнива_тимч 2>&1 | tee лог_жнив.txt
          else
            python3 жниварка.py --режим проба --стеля 3 --магазини "${{ inputs.shops }}" --група "${{ matrix.group }}" \
              --потоки 4 --хвилин-на-магазин 2 --дедлайн-хвилин 25 --вихід жнива_проба 2>&1 | tee лог_жнив.txt
          fi
      - name: підготувати артефакт
        if: always()
        run: |
          set -e
          mkdir -p артефакт/сирі
          cp -f zhnyvarka/жнива_сирі/*.json.gz артефакт/сирі/ 2>/dev/null || true
          cp -f zhnyvarka/жнива_сирі_проба/*.json.gz артефакт/сирі/ 2>/dev/null || true
          cp -f zhnyvarka/лог_жнив.txt "артефакт/лог_${{ strategy.job-index }}.txt" 2>/dev/null || true
          ls -la артефакт артефакт/сирі
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zhnyva-${{ strategy.job-index }}
          path: артефакт/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

  assemble:
    permissions:
      contents: write
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: 'python3 -m pip install --quiet --only-binary=:all: --require-hashes -r .github/requirements/жниварка.txt'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zhnyva-*
          path: зібране
          merge-multiple: true
      - name: злиття
        id: assemble
        run: |
          set -e
          echo "=== що завантажено ==="; find зібране -type f | head -60 || true
          if [ "${{ inputs.mode }}" = "повний" ]; then OUT=жнива; else OUT=жнива_проба; fi
          # артефакт може лягти як зібране/сирі/ або зібране/<щось>/сирі/ — беремо всі .json.gz звідусіль
          mkdir -p zhnyvarka/вхід_сирі "zhnyvarka/$OUT"
          find зібране -name "*.json.gz" -exec cp -f {} zhnyvarka/вхід_сирі/ \; 2>/dev/null || true
          n=$(ls zhnyvarka/вхід_сирі/*.json.gz 2>/dev/null | wc -l); echo "сирих файлів: $n"
          if [ "$n" -eq 0 ]; then echo "!! артефакт порожній — дивіться лог кроку «жнива»"; exit 1; fi
          # сирі не копіюємо в репозиторій — вони вже в артефакті кроку «жнива»
          cd zhnyvarka
          python3 жниварка.py --зібрати --сирі вхід_сирі --вихід "$OUT"
          cat ../зібране/лог_*.txt > "$OUT/лог_жнив.txt" 2>/dev/null || true
          find ../зібране -name "лог_*.txt" -exec cat {} \; >> "$OUT/лог_жнив.txt" 2>/dev/null || true
          rm -rf вхід_сирі
          echo "=== $OUT/звіт_жнив.md ==="; head -60 "$OUT/звіт_жнив.md"
          echo "=== розміри ==="; ls -lh "$OUT" | tail -n +2
          echo "Сирі жнива — в артефактах цього запуску (Actions → run → Artifacts), у repo не комітяться."
      - name: діагностика каталогу після жнив
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ inputs.mode }}" = "повний" ]; then OUT=жнива; else OUT=жнива_проба; fi
          CATALOG="zhnyvarka/$OUT/каталог_повний.xml"
          # Старий файл checkout не видаємо за вихід невдалого складання.
          if [ "${{ steps.assemble.outcome }}" != "success" ]; then CATALOG="$RUNNER_TEMP/каталог_жнив_відсутній.xml"; fi
          python3 джерела/прилади/звіт_після_жнив.py --вихід "zhnyvarka/$OUT" \
            --каталог "$CATALOG" \
            --стан "жнива: ${{ needs.harvest.result }}; складання: ${{ steps.assemble.outcome }}"
      - name: зберегти звіт прогону
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zhnyvarka-diagnostics
          path: |
            zhnyvarka/жнива/діагностика_каталогу.*
            zhnyvarka/жнива/звіт_жнив.md
            zhnyvarka/жнива_проба/діагностика_каталогу.*
            zhnyvarka/жнива_проба/звіт_жнив.md
          if-no-files-found: warn
          retention-days: 30
      - name: коміт результату
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          set -e
          if [ "${{ inputs.mode }}" = "повний" ]; then OUT=жнива; else OUT=жнива_проба; fi
          git config user.name "жниварка"
          git config user.email "zhnyvarka@users.noreply.github.com"
          # У repo — лише звіт, journal і каталоги. Сирі жнива (десятки МБ) лишаються артефактом
          # запуску: Actions → цей запуск → Artifacts → zhnyva-*. Так гілка не засмічується.
          rm -rf zhnyvarka/жнива_сирі
          git add "zhnyvarka/$OUT"
          git commit -m "жнива: ${{ inputs.mode }} · ${{ inputs.shops }} · $(date -u +%Y-%m-%d\ %H:%M)" || echo "нема що комітити"
          git pull --rebase origin HEAD || true
          git push
          
