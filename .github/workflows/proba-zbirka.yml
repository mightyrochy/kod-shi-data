# ПРОБА (тимчасово, знімається в цьому ж PR): виклик zbirka.yml з тими самими permissions, що в samozlyttia.yml.
# Job викликаного процесу не виконується: умова хибна під час запуску; startup_failure дає сама перевірка виклику.
name: проба виклику zbirka

on:
  push:
    branches: ['claude/CI-самозлиття-запуск']

permissions: {}

jobs:
  zbirka:
    if: github.run_attempt == 0
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/zbirka.yml
    with:
      pered: ${{ github.sha }}
      pislia: ${{ github.sha }}
