# Збірка продукту з джерел (наряд Н-00-01, джерело V01).
#
# ЩО ЦЕ ЛАГОДИТЬ. Опублікований index.html робився руками — комітами
# «Add files via upload». Тому продукт міг відстати від джерел і мовчати про
# це: виміряно 10.09.2026, що на Pages виконувався код станом на 04.09, тоді як
# у джерелах лежало близько 35 правок, і жоден гейт цього не бачив. Збірка
# руками — це не процес, а звичка, і зникає вона разом з тим, хто її пам'ятав.
#
# ЩО ЛИШИЛОСЬ ЗРОБИТИ РУКАМИ ВЛАСНИКУ (правилом гілки, не файлом — крок 2
# наряду): заборонити push у `main` повз цей workflow, щоб «Add files via
# upload» більше не міг перезаписати зібраний артефакт. Поки правила нема,
# ручний коміт і далі переможе бота — файл про це сказати не може.
name: збірка показу

on:
  push:
    branches: [main]
    # Збірка має сенс лише коли змінилось те, з чого вона збирається. Без
    # фільтра бот-коміт «збірка: …» сам себе б і запускав — нескінченно.
    paths:
      - 'джерела/**'
      - 'каталог_повний.xml.gz'
      - '.github/workflows/zbirka.yml'
  workflow_dispatch:

permissions:
  contents: write

# ОДНА ЗБІРКА ВОДНОЧАС. `cancel-in-progress: false` — перервана посеред коміту
# збірка гірша за чергу.
# ЧОГО ЦЕ НЕ РОБИТЬ, І ЦЕ ТРЕБА СКАЗАТИ ВГОЛОС: від гонки з жнивами група тут
# не рятує. `zhnyva.yml`, `zhnyvarka.yml` і `rozvidka.yml` теж комітять у `main`,
# але кожен у ВЛАСНІЙ групі (`zhnyva`, `zhnyvarka`, `rozvidka`), а спільна група
# вимагала б правити ті три файли — вони поза межами цього наряду. Тому від
# гонки боронить не група, а `git pull --rebase` перед push у кроці коміту:
# рівно так це зроблено в `zhnyvarka.yml:129`.
concurrency:
  group: збірка-показу
  cancel-in-progress: false

jobs:
  # КЛЮЧ JOB'А — ASCII, І ЦЕ НЕ СТИЛЬ, А ВИМОГА GITHUB: `jobs.<job_id>` мусить
  # починатися з літери або `_` і містити лише [A-Za-z0-9_-]. Тут стояло
  # `зібрати`, і наслідок був не косметичний — workflow не запускався ЖОДНОГО
  # разу від дня написання: прогін створювався й умирав до першого кроку (нуль
  # job'ів, `created_at == run_started_at`), і так на КОЖНІЙ гілці, бо фільтр
  # `branches: [main]` лежить усередині файла, який не вдалося розібрати.
  # Людське ім'я живе в `name:` — воно рядок, і кирилиця там законна.
  zbirka:
    name: зібрати показ-повний
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # node потрібен збирачеві: `node --check` на JS сторінки — гейт 2 збірки.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # jsdom-батарея показу — гейт 5 збірки (Н-V01-003). Без неї збирач не
      # падає, а друкує попередження; у CI ми хочемо саме перевірку.
      - name: залежності батареї показу
        working-directory: джерела
        run: npm i jsdom fake-indexeddb

      # Каталог лежить у репозиторії стиснутим; чистка знімає помилки слота й
      # подвійні екранування, без яких гейт чистоти збирача відмовляє.
      - name: розпакувати й почистити каталог
        run: |
          gunzip -kc каталог_повний.xml.gz > джерела/каталог_повний.xml
          cd джерела
          python3 -c "import чистка_каталогу as ч; print(ч.почистити('каталог_повний.xml','каталог_повний.xml'))"

      - name: зібрати показ-повний
        working-directory: джерела
        env:
          # Латиницею: bash не експортує кириличні імена, тож `env:` тут
          # працює лише з `LYUSTERKO_CATALOG` (див. build_артефакт.py).
          LYUSTERKO_CATALOG: повний
        run: |
          set -o pipefail
          # Штамп і лічба модулів — у підсумок прогону, щоб не лізти в логи по
          # одному рядку, заради якого прогін і робиться.
          python3 build_артефакт.py . ../index.html показ-повний 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Вантаж мусить збігатися з джерелами. Після щойно зробленої збірки це
      # тавтологія — і саме тому крок дешевий, а мовчазний розсинхрон більше
      # неможливий: код виходу 1 червонить збірку до коміту артефакта.
      - name: звірка вантажу з джерелами
        working-directory: джерела
        run: python3 звірка_вантажу.py

      - name: закомітити артефакт
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html не змінився — коміту нема"
            exit 0
          fi
          # ІМ'Я ЗМІННОЇ — ЛАТИНИЦЕЮ, З ТІЄЇ Ж ПРИЧИНИ, ЩО Й `LYUSTERKO_CATALOG`
          # вище: bash не має кириличних імен змінних. `ШТАМП=$(...)` — це для
          # нього не присвоєння, а спроба виконати команду з такою назвою: код
          # 127, а під `set -e` крок падає. Урок уже був записаний у цьому файлі
          # для `env:` — і не застосований тут.
          SHTAMP=$(grep -o 'const ЗБІРКА_ПОКАЗУ = "[^"]*"' index.html | head -1 | sed 's/.*= "//; s/"$//')
          git add index.html
          git commit -m "збірка: ${SHTAMP}"
          # За зразком zhnyvarka.yml:129 — жнива й розвідка комітять у той самий
          # `main` зі своїх груп, тож між нашим комітом і push туди міг заїхати
          # чужий. Ребейз поверх нього, а не push силою.
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
