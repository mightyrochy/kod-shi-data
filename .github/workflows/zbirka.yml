name: збірка показу

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'джерела/**'
      - '!джерела/аудит/ДОСЯЖНІСТЬ.md'
      - 'каталог_повний.xml.gz'
      - '.github/workflows/zbirka.yml'
      - 'аудит/дошка/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: збірка-показу-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zminy:
    permissions:
      contents: read
    name: що змінилось у push
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lyshe_doshka: ${{ steps.zmina.outputs.lyshe_doshka }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: чи змінилась лише дошка
        id: zmina
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          lyshe=false
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ -n "${BEFORE//0/}" ] \
             && git fetch --no-tags --depth=1 origin "${BEFORE}" 2>/dev/null; then
            zminy=$(git -c core.quotepath=off diff --name-only "${BEFORE}" "${GITHUB_SHA}")
            if [ -n "${zminy}" ] && ! printf '%s\n' "${zminy}" | grep -qv '^аудит/дошка/'; then
              lyshe=true
            fi
          fi
          echo "lyshe_doshka=${lyshe}" >> "$GITHUB_OUTPUT"
          echo "лише дошка: ${lyshe}" >> "$GITHUB_STEP_SUMMARY"

  perevirka:
    permissions:
      contents: read
    name: перевірка джерел
    needs: zminy
    if: needs.zminy.outputs.lyshe_doshka != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: файли дошки згортаються (лише перевірка)
        if: github.event_name == 'pull_request'
        run: python3 джерела/прилади/згорнути_дошку.py --лише-перевірити

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: залежності батареї показу
        working-directory: джерела
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: node --check на кожен .js у джерела/
        run: |
          set -u
          fails=0
          for f in $(find джерела -name node_modules -prune -o -name '*.js' -print | sort); do
            if node --check "$f" >/dev/null 2>&1; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              node --check "$f" || true
              fails=$((fails + 1))
            fi
          done
          echo "node --check: fails $fails"
          [ "$fails" -eq 0 ]

      - name: py_compile на кожен .py у джерела/
        run: |
          python3 - <<'PY'
          import os
          import py_compile
          import sys

          files = []
          for root, dirs, names in os.walk("джерела"):
              dirs[:] = [name for name in dirs if name != "node_modules"]
              files.extend(os.path.join(root, name) for name in names
                           if name.endswith(".py") and name != "node_modules")
          fails = 0
          for path in sorted(files):
              try:
                  py_compile.compile(path, doraise=True)
              except (py_compile.PyCompileError, OSError) as error:
                  print(f"  ✗ {path}\n{error}")
                  fails += 1
          print(f"py_compile: files {len(files)}; fails {fails}")
          sys.exit(bool(fails))
          PY

      - name: проби поділу (ВПАЛО має лишатись 0)
        working-directory: джерела
        run: |
          set -u
          VPALO=0
          for f in проби/поділ_*_ast.py; do
            python3 "$f" || { echo "  ✗ $f"; VPALO=$((VPALO + 1)); }
          done
          echo "проби поділу: ВПАЛО $VPALO"
          [ "$VPALO" -eq 0 ]

      - name: розпакувати каталоги й почистити фід
        working-directory: джерела
        run: |
          python3 -c "import чистка_каталогу as ч, feed as Ф; print('фід:', ч.забезпечити_чистим('каталог_повний.xml')); print('фікстура:', Ф.каталог_на_диску('каталог_brief.xml'))"

      - name: дим на живому шляху
        working-directory: джерела
        run: python3 стенд_знімок.py --дим

      - name: живий шлях (4 руки × 2 каталоги, brief)
        working-directory: джерела
        run: python3 тест_живого_шляху.py

      - name: протокол
        working-directory: джерела
        run: python3 тест_протоколу.py

      - name: компілятор байткоду повного показу
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: pyc_python
        with:
          python-version: '3.12.1'
          update-environment: false

      - name: зібрати показ-повний і перевірити jsdom
        working-directory: джерела
        env:
          LYUSTERKO_CATALOG: повний
          LYUSTERKO_PYC_PYTHON: ${{ steps.pyc_python.outputs.python-path }}
        run: |
          set -o pipefail
          python3 build_артефакт.py . ../index.html показ-повний 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: перевірений показ → job'у публікації
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokaz-povnyi-${{ github.sha }}
          path: index.html
          if-no-files-found: error
          retention-days: 7

      - name: міст (50 звірок)
        id: mist
        working-directory: джерела
        run: |
          set -o pipefail
          node тест_мосту.js 2>&1 | tee ../міст.log

      - name: досяжність («НІХТО» мусить лишатись 0)
        id: dosiazhnist
        working-directory: джерела
        run: |
          set -o pipefail
          python3 досяжність.py 2>&1 | tee ../досяжність.log
          NIKHTO=$(grep -oE '«НІХТО» = [0-9]+' ../досяжність.log | tail -1 | grep -oE '[0-9]+')
          echo "«НІХТО» = ${NIKHTO}"
          [ "${NIKHTO}" = "0" ]

      - name: звіт досяжності → job'у збірки
        if: always() && steps.dosiazhnist.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosiazhnist-zvit
          path: джерела/аудит/ДОСЯЖНІСТЬ.md
          if-no-files-found: error
          retention-days: 7

      - name: стенд у браузері (Chromium + Pyodide, 20 звірок)
        id: stend
        continue-on-error: true
        env:
          LYUSTERKO_PYC_PYTHON: ${{ steps.pyc_python.outputs.python-path }}
        run: |
          set -o pipefail
          ( cd джерела && ./node_modules/.bin/playwright install --with-deps chromium )
          sh аудит/проби/стенд_pyodide_кеш.sh "${RUNNER_TEMP}/pyodide"
          mkdir -p "${RUNNER_TEMP}/стенд"
          cp index.html "${RUNNER_TEMP}/стенд/index.html"
          NODE_PATH=джерела/node_modules node аудит/проби/рв6_стенд.js \
            http://127.0.0.1:8765 "${RUNNER_TEMP}/стенд" "${RUNNER_TEMP}/pyodide" 3 2>&1 | tee стенд.log

      - name: складальник каталогу — звіт записано → прочитано (не гейт)
        continue-on-error: true
        run: |
          python3 zhnyvarka/складальник.py --проміжний "${RUNNER_TEMP}/складальник.xml" 2>&1 | tee складальник.log
          {
            echo "### Складальник каталогу (рядок 5651)"
            echo '```'
            grep -E '^збірка із|^кадрів знято|^поле  |^поле:опис|^поле:артикул|^поле:виробник|РОЗБІЖНІСТЬ' складальник.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: числа приладів у підсумок
        if: always()
        run: |
          {
            echo "### Числа приладів"
            echo ""
            if [ -f міст.log ]; then
              MIST_FAILED=$(grep -oE 'ВПАЛО [0-9]+' міст.log | tail -1 | grep -oE '[0-9]+' || true)
              echo "- \`node тест_мосту.js\` — ВПАЛО: **${MIST_FAILED:-0}** (рядок 2 дошки закрито; було 5 на \`main\` 18.09 — крок блокує)"
            else
              echo "- \`node тест_мосту.js\` — крок не дійшов до виводу"
            fi
            if [ -f досяжність.log ]; then
              NIKHTO=$(grep -oE '«НІХТО» = [0-9]+' досяжність.log | tail -1 | grep -oE '[0-9]+' || true)
              echo "- \`python3 досяжність.py\` — «НІХТО»: **${NIKHTO:-?}** (рядок 8 дошки закрито; було 1 на \`main\` 18.09 — крок блокує)"
            else
              echo "- \`python3 досяжність.py\` — крок не дійшов до виводу"
            fi
            if [ -f стенд.log ]; then
              ZELENYH=$(grep -cE '^  ✔' стенд.log || true)
              CHERVONYH=$(grep -cE '^  ✗' стенд.log || true)
              echo "- \`node аудит/проби/рв6_стенд.js\` — звірок: **${ZELENYH:-0} ✔ / ${CHERVONYH:-0} ✗** (Chromium + Pyodide проти зібраного index.html; крок поки не блокує)"
            else
              echo "- \`node аудит/проби/рв6_стенд.js\` — крок не дійшов до виводу"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rozdily:
    permissions:
      contents: read
    name: розділи й контракти
    needs: zminy
    if: needs.zminy.outputs.lyshe_doshka != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: залежності батареї показу
        working-directory: джерела
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: розпакувати каталоги й почистити фід
        working-directory: джерела
        run: |
          python3 -c "import чистка_каталогу as ч, feed as Ф; print('фід:', ч.забезпечити_чистим('каталог_повний.xml')); print('фікстура:', Ф.каталог_на_диску('каталог_brief.xml'))"

      - name: розділи гейтів (ВПАЛО має лишатись 0)
        working-directory: джерела
        run: python3 прилади/розділи_гейтів.py

      - name: контракти (мають лишатись цілі)
        working-directory: джерела
        run: python3 audit_contracts.py


  pravyla:
    permissions:
      contents: read
    name: звіт правил (не гейт)
    needs: zminy
    if: needs.zminy.outputs.lyshe_doshka != 'true'
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: повна історія правил (межа 180 с)
        id: pravyla
        continue-on-error: true
        working-directory: джерела
        run: |
          set +e
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 180s python3 -u правила.py --md "${RUNNER_TEMP}/правила.md" 2>&1 | tee "${RUNNER_TEMP}/правила.log"
          STATUS=("${PIPESTATUS[@]}")
          echo "kod=${STATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "log_kod=${STATUS[1]}" >> "$GITHUB_OUTPUT"
          if [ "${STATUS[0]}" -ne 0 ]; then
            exit "${STATUS[0]}"
          fi
          exit "${STATUS[1]}"

      - name: стан звіту правил у підсумок
        if: always()
        env:
          REPORT_RC: ${{ steps.pravyla.outputs.kod }}
          LOG_RC: ${{ steps.pravyla.outputs.log_kod }}
          REPORT_OUTCOME: ${{ steps.pravyla.outcome }}
        run: |
          {
            echo "### Правила — звіт, не гейт"
            echo "- Стан кроку: ${REPORT_OUTCOME:-НЕ ВИКОНАНО}; код процесу: ${REPORT_RC:-НЕ ВИМІРЯНО}; код запису логу: ${LOG_RC:-НЕ ВИМІРЯНО}."
            case "${REPORT_RC}" in
              124|137) echo "- Часову межу 180 с вичерпано або процес примусово завершено; повний звіт НЕ ОТРИМАНО." ;;
              0) echo "- Процес завершився. Код 0 не є оцінкою правил; числа й відсутність входу читаються в логу." ;;
              "") echo "- Код процесу відсутній: звіт не завершився або крок не запускався; успіх не встановлено." ;;
              *) echo "- Процес відмовив; частковий вивід не є повним звітом." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: лог і отриманий довідник правил
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pravyla-zvit
          path: |
            ${{ runner.temp }}/правила.log
            ${{ runner.temp }}/правила.md
          if-no-files-found: warn
          retention-days: 7

  zbirka:
    permissions:
      contents: read
    name: зібрати показ-повний
    needs: [zminy, perevirka, rozdily]
    if: ${{ !cancelled() && needs.zminy.result == 'success' && (needs.zminy.outputs.lyshe_doshka == 'true' || (needs.perevirka.result == 'success' && needs.rozdily.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: перевірений показ із перевірки
        if: needs.zminy.outputs.lyshe_doshka != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pokaz-povnyi-${{ github.sha }}
          path: .

      - name: звірка вантажу з джерелами
        if: needs.zminy.outputs.lyshe_doshka != 'true'
        working-directory: джерела
        run: python3 звірка_вантажу.py

      - name: свіжий звіт досяжності з перевірки
        if: needs.zminy.outputs.lyshe_doshka != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dosiazhnist-zvit
          path: джерела/аудит

      - name: перевірені файли → публікації
        if: needs.zminy.outputs.lyshe_doshka != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publikatsiia-${{ github.sha }}
          path: |
            index.html
            джерела/аудит/ДОСЯЖНІСТЬ.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: опублікувати перевірений показ і дошку
    needs: [zminy, zbirka]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.zbirka.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: перевірені файли зі збірки
        if: needs.zminy.outputs.lyshe_doshka != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publikatsiia-${{ github.sha }}
          path: .

      - name: згорнути дошку
        id: zghortannia
        continue-on-error: true
        run: |
          set +e
          python3 джерела/прилади/згорнути_дошку.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: закомітити артефакт
        env:
          LYSHE_DOSHKA: ${{ needs.zminy.outputs.lyshe_doshka }}
        run: |
          set -e
          SOURCE_SHA=$(git rev-parse HEAD)
          if [ "${LYSHE_DOSHKA}" = "true" ]; then
            git add -A аудит/БЕКЛОГ.md
            git add -A аудит/дошка 2>/dev/null || true
            MSG="дошка: згорнуто файли аудит/дошка (${SOURCE_SHA})"
          else
            SHTAMP=$(grep -o 'const ЗБІРКА_ПОКАЗУ = "[^"]*"' index.html | head -1 | sed 's/.*= "//; s/"$//')
            if [ "${SHTAMP}" != "${SOURCE_SHA}" ]; then
              echo "штамп ${SHTAMP} не відповідає джерелам ${SOURCE_SHA} — публікацію зупинено"
              exit 1
            fi
            printf '%s' "${SHTAMP}" > build.txt
            ZVIT="джерела/аудит/ДОСЯЖНІСТЬ.md"
            git add index.html build.txt "${ZVIT}" аудит/БЕКЛОГ.md
            git add -A аудит/дошка 2>/dev/null || true
            MSG="збірка: ${SHTAMP}"
          fi
          if git diff --cached --quiet; then
            echo "артефакт, штамп, звіт і дошка не змінились — коміту нема"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${MSG}"

          # Рядок 8651: push поза `paths` збірки не запускає, тож публікацію, якої новіші коміти не стосуються,
          # переносимо на нову голову; штамп лишається SHA джерел. Зміни в `paths` публікує їхня власна збірка.
          OSNOVA="${SOURCE_SHA}"
          for sproba in 1 2 3 4 5; do
            git fetch --no-tags origin refs/heads/main
            MAIN_SHA=$(git rev-parse FETCH_HEAD)
            if [ "${MAIN_SHA}" != "${OSNOVA}" ]; then
              SHLYAKHY=()
              while IFS= read -r shl; do
                case "${shl}" in
                  '!'*) SHLYAKHY+=(":(exclude,glob)${shl#!}") ;;
                  *) SHLYAKHY+=(":(glob)${shl}") ;;
                esac
              done < <(awk '/^    paths:$/ {p=1; next} p && /^ *#/ {next} p && /^      - / {print; next} p {exit}' .github/workflows/zbirka.yml \
                       | sed "s/^      - '//; s/'$//")
              if [ "${#SHLYAKHY[@]}" -eq 0 ]; then
                echo "paths збірки не прочитано з zbirka.yml — публікацію джерел ${SOURCE_SHA} не перенесено" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              ZMINY=$(git -c core.quotepath=off diff --name-only "${SOURCE_SHA}" "${MAIN_SHA}" -- "${SHLYAKHY[@]}")
              if [ -n "${ZMINY}" ]; then
                echo "main ${MAIN_SHA} вже новіший за джерела ${SOURCE_SHA} і змінив paths збірки — застарілу публікацію пропущено, публікує його збірка" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              PUBLIKATSIIA=$(git rev-parse HEAD)
              git checkout -q --detach "${MAIN_SHA}"
              if ! git cherry-pick "${PUBLIKATSIIA}"; then
                git cherry-pick --abort || true
                echo "main ${MAIN_SHA}: публікація джерел ${SOURCE_SHA} не лягає на новіші коміти (конфлікт) — пропущено без силового push" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              OSNOVA="${MAIN_SHA}"
              echo "main ${MAIN_SHA} не змінив paths збірки — публікацію джерел ${SOURCE_SHA} перенесено на нову голову" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "артефакт джерел ${SOURCE_SHA} запушено зі спроби ${sproba}"
              exit 0
            fi
            echo "push відбито (спроба ${sproba}) — перед повтором звіримо SHA main"
          done
          echo "п'ять спроб push не пройшли без просування main — публікація не відбулась"
          exit 1

      - name: згортання дошки — помилки
        if: always() && steps.zghortannia.outcome == 'failure'
        run: |
          echo "згортання аудит/дошка не вдалось повністю — файли з помилкою лишились, див. крок «згорнути дошку»" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
