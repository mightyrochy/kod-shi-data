# Збірка продукту з джерел (наряд Н-00-01, джерело V01) і перевірка перед нею
# (рядки 27 і 33 дошки тріажу).
#
# ЩО ЦЕ ЛАГОДИТЬ. Опублікований index.html робився руками — комітами
# «Add files via upload». Тому продукт міг відстати від джерел і мовчати про
# це: виміряно 10.09.2026, що на Pages виконувався код станом на 04.09, тоді як
# у джерелах лежало близько 35 правок, і жоден гейт цього не бачив. Збірка
# руками — це не процес, а звичка, і зникає вона разом з тим, хто її пам'ятав.
#
# ЩО ЛАГОДИТЬ JOB `perevirka` (додано 19.09.2026). До нього workflow ішов ЛИШЕ
# на `push` у `main` — тобто вперше дивився на код уже ПІСЛЯ злиття. 18.09 три
# PR (#89, #90, #95) злились у `main` без жодної перевірки, і `тест_показу.js`
# приїхав туди з незакритою дужкою після злиття: батарея показу перестала
# виконуватись, публікація продукту стояла годину. Жодна перевірка цього не
# спіймала не тому, що її не було в репозиторії, а тому, що CI її не кликав:
# у workflow були лише `build_артефакт`, `звірка_вантажу` і `jsdom`, а
# `тест_живого_шляху`, `тест_протоколу`, `тест_показу`, `досяжність` і
# `node --check` жили тільки в чужих руках. Тепер CI бачить те саме, що бачить
# ревізія, і бачить це ДО злиття — на `pull_request` у `main`.
#
# ЩО ЛИШИЛОСЬ ЗРОБИТИ РУКАМИ ВЛАСНИКУ (правилом гілки, не файлом — крок 2
# наряду): заборонити push у `main` повз цей workflow, щоб «Add files via
# upload» більше не міг перезаписати зібраний артефакт, і зробити `perevirka`
# обов'язковою перевіркою для злиття PR. Поки правила нема, ручний коміт і
# далі переможе бота — файл про це сказати не може.
name: збірка показу

on:
  # PR у `main` — головна причина існування job'а `perevirka`. Фільтра `paths`
  # тут СВІДОМО нема: рядок 27 дошки вимагає, щоб CI бачив те саме, що ревізія,
  # а зміна в `аудит/проби/` чи у workflow теж може зламати батарею.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Збірка має сенс лише коли змінилось те, з чого вона збирається. Без
    # фільтра бот-коміт «збірка: …» сам себе б і запускав — нескінченно.
    # ЗАПЕРЕЧЕННЯ НИЖЧЕ — ЧАСТИНА ТОГО Ж ЗАМКА (24.09.2026). Відколи бот-коміт
    # «збірка: …» несе ще й `джерела/аудит/ДОСЯЖНІСТЬ.md`, він потрапляє під
    # `джерела/**` — тобто під той самий шаблон, від якого рятує фільтр. Рядок
    # `!джерела/аудит/ДОСЯЖНІСТЬ.md` виключає саме цей файл: коміт, де змінився
    # лише він (і кореневий `index.html`, якого в переліку й не було), нової
    # збірки не запускає. Порядок важить — заперечення мусить стояти ПІСЛЯ
    # `джерела/**`, інакше наступний ширший шаблон поверне файл назад.
    paths:
      - 'джерела/**'
      - '!джерела/аудит/ДОСЯЖНІСТЬ.md'
      - 'каталог_повний.xml.gz'
      - '.github/workflows/zbirka.yml'
  workflow_dispatch:

permissions:
  contents: read

# ОДНА ЗБІРКА ВОДНОЧАС. `cancel-in-progress: false` — перервана посеред коміту
# збірка гірша за чергу.
# ЧОГО ЦЕ НЕ РОБИТЬ, І ЦЕ ТРЕБА СКАЗАТИ ВГОЛОС: від гонки з жнивами група тут
# не рятує. `zhnyva.yml`, `zhnyvarka.yml` і `rozvidka.yml` теж комітять у `main`,
# але кожен у ВЛАСНІЙ групі (`zhnyva`, `zhnyvarka`, `rozvidka`), а спільна група
# вимагала б правити ті три файли — вони поза межами цього наряду. Тому від
# гонки боронить не група, а `git pull --rebase` перед push у кроці коміту.
# ПРО PR: кожен PR дістає ВЛАСНУ групу (`…-refs/pull/N/merge`), інакше
# перевірки всіх відкритих PR стали б у чергу за збіркою `main` і чекали б по
# кілька хвилин на порожньому місці. Збірки `main` як стояли в одній черзі, так
# і стоять.
concurrency:
  group: збірка-показу-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # КЛЮЧ JOB'А — ASCII, І ЦЕ НЕ СТИЛЬ, А ВИМОГА GITHUB: `jobs.<job_id>` мусить
  # починатися з літери або `_` і містити лише [A-Za-z0-9_-]. Тут колись стояло
  # `зібрати`, і наслідок був не косметичний — workflow не запускався ЖОДНОГО
  # разу від дня написання: прогін створювався й умирав до першого кроку (нуль
  # job'ів, `created_at == run_started_at`), і так на КОЖНІЙ гілці, бо фільтр
  # `branches: [main]` лежить усередині файла, який не вдалося розібрати.
  # Людське ім'я живе в `name:` — воно рядок, і кирилиця там законна.
  perevirka:
    name: перевірка джерел
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` — НЕ «про всяк випадок». Проби поділу нижче звіряють поточний
      # модуль із файлом ДО поділу, а беруть його `git show <БАЗА>:джерела/<файл>.py`.
      # Бази — коміти вересня (`ac8c2ca`, `e4b36ae`, `b993a38`…), а типовий checkout бере
      # глибину 1: `git show` віддав би 128 і крок падав би завжди, на будь-якому коді.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: залежності батареї показу
        working-directory: джерела
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Синтаксис — перший гейт і найдешевший. САМЕ ЦЬОГО БРАКУВАЛО 18.09:
      # `тест_показу.js` з незакритою дужкою заїхав у `main`, і ніщо в CI не
      # мало права сказати «ні». `node --check` на кожен `.js` у `джерела/`
      # коштує частку секунди й ловить увесь клас поломок злиття.
      # `node_modules` відрізано: чужий код не наша відповідальність, а
      # перевірка його зайняла б хвилини.
      - name: node --check на кожен .js у джерела/
        run: |
          set -u
          fails=0
          for f in $(find джерела -name node_modules -prune -o -name '*.js' -print | sort); do
            if node --check "$f" >/dev/null 2>&1; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              node --check "$f" || true
              fails=$((fails + 1))
            fi
          done
          echo "node --check: fails $fails"
          [ "$fails" -eq 0 ]

      # Те саме для Python: компіляція без виконання. Ловить те, що злиття
      # ламає найчастіше, — відступ і дужку, — і не потребує ні каталогу, ні
      # мережі.
      - name: py_compile на кожен .py у джерела/
        run: |
          python3 - <<'PY'
          import os
          import py_compile
          import sys

          files = []
          for root, dirs, names in os.walk("джерела"):
              dirs[:] = [name for name in dirs if name != "node_modules"]
              files.extend(os.path.join(root, name) for name in names
                           if name.endswith(".py") and name != "node_modules")
          fails = 0
          for path in sorted(files):
              try:
                  py_compile.compile(path, doraise=True)
              except (py_compile.PyCompileError, OSError) as error:
                  print(f"  ✗ {path}\n{error}")
                  fails += 1
          print(f"py_compile: files {len(files)}; fails {fails}")
          sys.exit(bool(fails))
          PY

      # РЯДОК 148 ДОШКИ: ДО ЦЬОГО КРОКУ CI НЕ БАЧИВ ПРОБ ПОДІЛУ. 14 проб
      # `проби/поділ_*_ast.py` звіряють, що кожна функція й константа, яка переїхала
      # в поділений модуль, має ТОЙ САМИЙ AST, що й у файлі до поділу, — окрім пар,
      # свідомо записаних у реєстр `проби/поділ_очікувані.d/`. Вони жили лише в руках
      # виконавця («14 проб поділу rc 0» у тілі PR), тож регресія в них не блокувала
      # злиття, якщо хтось забув прогнати. І забували: на 27.09 8 із 14 стояли
      # червоними на `main` — не поломкою продукту, а реєстром, що відстав від злитих
      # правок (переважно 9478f917, хвиля п.12 «код не пише фраз людині»).
      # Код виходу кожної проби вже двійковий: розбіжність поза реєстром, загублений
      # вузол чи запис реєстру, що не справдився, → 1. Вимірювання: усі 14 разом ~5 с.
      #
      # РЯДОК 186 ДОШКИ (наряд CI-5, 27.09.2026): цей крок сам стояв ЧЕРВОНИМ на `main`
      # у всіх прогонах від #414 включно — ВПАЛО 5 (accessory 32 проти 23, outer 21 проти
      # 15, суд 31 проти 17, pipeline 73 проти 71, реєстр_правил 5 проти 4), разом 32 пари
      # без запису в реєстрі, усі за #417 (П-6) і #411 (П-7). Замок, червоний завжди, не
      # блокує нічого: жоден PR не міг бути зеленим, а знахідку поділу в цьому червоному
      # ніхто б не побачив. Записи завела гілка CI-5 від імені винуватця (`п-6-pr417.txt`,
      # `п-7-pr411.txt`), і щоб це не повторилось, кожна проба при падінні друкує ГОТОВИЙ
      # рядок реєстру й каже, у ЧИЙ файл його класти (`поділ_спільне.підказка_реєстру`) —
      # видно просто в цьому логу, без читання коду проби.
      - name: проби поділу (ВПАЛО має лишатись 0)
        working-directory: джерела
        run: |
          set -u
          # Ім'я змінної ЛАТИНИЦЕЮ: bash кириличних не має — `впало=0` дає
          # «command not found» (спіймано прогоном цього самого циклу перед пушем).
          # Той самий урок уже записано вище про `LYUSTERKO_CATALOG`.
          VPALO=0
          for f in проби/поділ_*_ast.py; do
            python3 "$f" || { echo "  ✗ $f"; VPALO=$((VPALO + 1)); }
          done
          echo "проби поділу: ВПАЛО $VPALO"
          [ "$VPALO" -eq 0 ]

      # Каталоги потрібні всій батареї нижче: `стенд_знімок` бере
      # `каталог_повний.xml`, живий шлях і показ — `каталог_brief.xml`. Обидва
      # лежать у git лише як `.gz` (розпаковані — у .gitignore).
      # ТА САМА ФУНКЦІЯ, ЩО Й У ЗБІРЦІ (19.09.2026, рядок 57 дошки). Доти тут
      # стояли `gunzip` і `ч.почистити(...)` рядками, яких НЕ робив ніхто, крім
      # CI: у свіжому checkout збірка падала («зонд не побачив `composer`», далі
      # «каталог_повний.xml БРУДНИЙ — помилок слота 325»), а CI був зелений —
      # два шляхи до одного продукту, з яких людський червоний за побудовою.
      # Тепер розпаковування й чистку робить `чистка_каталогу.забезпечити_чистим`,
      # і кличе її ТУТ САМЕ ТОЙ КОД, що й `build_артефакт`. Крок лишається, бо
      # прилади нижче (`стенд_знімок`, `тест_живого_шляху`, `тест_протоколу`)
      # читають каталоги, нічого не збираючи.
      - name: розпакувати каталоги й почистити фід
        working-directory: джерела
        run: |
          python3 -c "import чистка_каталогу as ч, feed as Ф; print('фід:', ч.забезпечити_чистим('каталог_повний.xml')); print('фікстура:', Ф.каталог_на_диску('каталог_brief.xml'))"

      - name: дим на живому шляху
        working-directory: джерела
        run: python3 стенд_знімок.py --дим

      - name: живий шлях (4 руки × 2 каталоги, brief)
        working-directory: джерела
        run: python3 тест_живого_шляху.py

      - name: протокол
        working-directory: джерела
        run: python3 тест_протоколу.py

      # РЯДОК 96 ДОШКИ: ДО ЦЬОГО КРОКУ CI НЕ БАЧИВ ЧЕРВОНИХ РОЗДІЛІВ ГЕЙТІВ.
      # Секція §141 стояла червоною на `main` з #162 до #167 (патч фасаду не
      # доходив до `палітра_нейтраль`), а CI лишався зеленим — прилад узагалі
      # не входив у workflow. Кожен код виходу вже двійковий (V02/V34): «ВПАЛО
      # 0» → 0, інакше 1. Вимірювання цього прогону: локально ~2 хв 49 с — той
      # самий вхід, що й тут (почищений каталог із кроку вище); окремий
      # паралельний job на runner-і не потрібен, поки разом із контрактами це
      # лишається помітно нижче ~5 хв.
      - name: розділи гейтів (ВПАЛО має лишатись 0)
        working-directory: джерела
        run: python3 прилади/розділи_гейтів.py

      # ТОЙ САМИЙ РЯДОК: `audit_contracts.py` теж жив лише в чужих руках.
      # Код виходу вже двійковий (Н-00-08): «КОНТРАКТИ ЦІЛІ» → 0, інакше —
      # сума розривів і мовчання. Вимірювання: локально ~18 с.
      - name: контракти (мають лишатись цілі)
        working-directory: джерела
        run: python3 audit_contracts.py

      # Збирач сам запускає jsdom по щойно записаному index.html.
      # Цей обов'язковий крок передає той самий файл стенду й публікації.
      - name: зібрати показ-повний і перевірити jsdom
        working-directory: джерела
        env:
          LYUSTERKO_CATALOG: повний
        run: |
          set -o pipefail
          python3 build_артефакт.py . ../index.html показ-повний 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: перевірений показ → job'у публікації
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokaz-povnyi-${{ github.sha }}
          path: index.html
          if-no-files-found: error
          retention-days: 7

      # МІСТ ТЕПЕР БЛОКУЄ: рядок 2 дошки закрито (фікстура фото подавала
      # воркерові заглушки, які він зобовʼязаний викидати). 50 звірок, rc 0
      # (27.09: +6 на температуру в тілі запиту, рядок 158 дошки).
      - name: міст (50 звірок)
        id: mist
        working-directory: джерела
        run: |
          set -o pipefail
          node тест_мосту.js 2>&1 | tee ../міст.log

      # ДОСЯЖНІСТЬ ТЕЖ БЛОКУЄ: рядок 8 дошки закрито («НІХТО» = 0). Прилад
      # віддає rc 0 і тоді, коли «НІХТО» > 0, — тому блокує не код виходу, а
      # число: крок нижче червонить прогін, якщо мертва функція зʼявилась. Це
      # не новий гейт «на кожну помилку», а та сама одна звірка, яку ревізія
      # доти читала руками; просто тепер її читає CI.
      - name: досяжність («НІХТО» мусить лишатись 0)
        id: dosiazhnist
        working-directory: джерела
        run: |
          set -o pipefail
          python3 досяжність.py 2>&1 | tee ../досяжність.log
          NIKHTO=$(grep -oE '«НІХТО» = [0-9]+' ../досяжність.log | tail -1 | grep -oE '[0-9]+')
          echo "«НІХТО» = ${NIKHTO}"
          [ "${NIKHTO}" = "0" ]

      # ЗВІТ ДОСЯЖНОСТІ ПЕРЕДАЄТЬСЯ JOB'У ЗБІРКИ, А НЕ КОМІТИТЬСЯ В ГІЛКУ
      # (24.09.2026, рядок 170 дошки). Крок вище щойно ПЕРЕГЕНЕРУВАВ
      # `джерела/аудит/ДОСЯЖНІСТЬ.md` у робочій теці — це побічний вихід
      # приладу, який досі кожен виконавець комітив у свою гілку руками. Через
      # це кожне злиття в `main` робило «dirty» усі інші відкриті PR: за ранок
      # 24.09 конфлікт РІВНО В ЦЬОМУ ФАЙЛІ ловили #240 (двічі), #242, #243,
      # #244, #246, #247 (двічі) і #248, а PR у конфлікті CI не запускає
      # взагалі (#247 на 0ecaf15 — нуль check runs). Тепер файл їде звідси
      # артефактом у job `zbirka`, і в `main` його кладе лише бот — тим самим
      # комітом «збірка: …», що й кореневий `index.html`.
      # ЧОМУ АРТЕФАКТ, А НЕ ПОВТОРНИЙ ПРОГІН У `zbirka`. `досяжність.py`
      # виконує живий шлях під `sys.setprofile` — це хвилини, а не секунди, і
      # другий прогін дав би ДРУГЕ число там, де має бути одне. Артефакт
      # переносить рівно той файл, за числом якого крок вище щойно пропустив
      # прогін.
      # `always()` — навмисно: «НІХТО» > 0 червонить крок вище ПІСЛЯ того, як
      # прилад уже записав звіт, тож саме в червоному прогоні людині найбільше
      # потрібен свіжий файл — побачити, яка функція впала в «ніхто».
      # `outcome != 'skipped'` боронить від зворотного: якщо до приладу прогін
      # не дійшов, вивантажувати нічого — у теці лежав би СТАРИЙ закомічений
      # файл. Лишається один вузький випадок — прилад упав, не дописавши звіт;
      # тоді артефакт несе старий файл, але job червоний, `zbirka` за `needs:`
      # не стартує і в `main` цей файл не потрапляє.
      - name: звіт досяжності → job'у збірки
        if: always() && steps.dosiazhnist.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosiazhnist-zvit
          path: джерела/аудит/ДОСЯЖНІСТЬ.md
          if-no-files-found: error
          retention-days: 7

      # СТЕНД У БРАУЗЕРІ — ЄДИНИЙ ПРИЛАД, ЩО ВИКОНУЄ JS ПОКАЗУ У СПРАВЖНЬОМУ
      # CHROMIUM зі справжнім Pyodide проти ЗІБРАНОГО `index.html`. jsdom-батарея
      # вище цього не вміє в принципі: у неї нема ні WebAssembly, ні мосту, ні
      # справжнього рендера, тож вона не бачить того класу поломок, який 16.09
      # зловив саме стенд (`псування_сценарію.join is not a function` — карток 0,
      # жінка бачила «Спробуй ще раз за хвилину»). Прилад проходить знайомство
      # кнопками, як жінка, шле репліку в чат, збирає чотири руки і читає журнал:
      # 20 звірок.
      #
      # ЧОМУ `continue-on-error: true` І ЧОМУ ЦЕ НЕ НАЗАВЖДИ. Крок довгий
      # (2 хв 19 с на раннері GitHub, прогін стенда в них — 68 с) і
      # має дві зовнішні залежності, яких нема в жодного кроку вище: браузер
      # Playwright і 13.7 МБ Pyodide з jsdelivr. Поки він не відстоявся кілька
      # прогонів у CI, червонити ним PR означало б гейт «на кожну помилку»,
      # якого власник не просив. Читається не колір кроку, а ЧИСЛО звірок у
      # підсумку прогону — «20 ✔ / 0 ✗» або скільки вийде.
      #
      # МЕРЕЖА: сам прогін її не має — уся мережа сторінки глушиться `route()`,
      # а Pyodide віддається з диска. Мережа потрібна рівно двом рядкам
      # підготовки нижче (браузер і кеш), і обидва виконуються ДО прогону.
      - name: стенд у браузері (Chromium + Pyodide, 20 звірок)
        id: stend
        continue-on-error: true
        run: |
          set -o pipefail
          ( cd джерела && ./node_modules/.bin/playwright install --with-deps chromium )
          sh аудит/проби/стенд_pyodide_кеш.sh "${RUNNER_TEMP}/pyodide"
          mkdir -p "${RUNNER_TEMP}/стенд"
          # Ті самі байти, що перевірив збирач і одержить job публікації.
          cp index.html "${RUNNER_TEMP}/стенд/index.html"
          NODE_PATH=джерела/node_modules node аудит/проби/рв6_стенд.js \
            http://127.0.0.1:8765 "${RUNNER_TEMP}/стенд" "${RUNNER_TEMP}/pyodide" 3 2>&1 | tee стенд.log

      # Рядок 5651: каталог — функція записів схеми v1 (`каталог_записи_v1.jsonl.gz`). Крок складає XML із записів,
      # звіряє байти з `каталог_повний.xml.gz`, читає складене фідом і друкує «записано → прочитано» по полях.
      # ЗВІТ, НЕ ГЕЙТ (п.3): `continue-on-error`, у підсумок йдуть лише рядки про збіг, опис і розбіжності.
      - name: складальник каталогу — звіт записано → прочитано (не гейт)
        continue-on-error: true
        run: |
          python3 zhnyvarka/складальник.py --проміжний "${RUNNER_TEMP}/складальник.xml" 2>&1 | tee складальник.log
          {
            echo "### Складальник каталогу (рядок 5651)"
            echo '```'
            grep -E '^збірка із|^кадрів знято|^поле  |^поле:опис|^поле:артикул|^поле:виробник|РОЗБІЖНІСТЬ' складальник.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: числа приладів у підсумок
        if: always()
        run: |
          {
            echo "### Числа приладів"
            echo ""
            if [ -f міст.log ]; then
              MIST_FAILED=$(grep -oE 'ВПАЛО [0-9]+' міст.log | tail -1 | grep -oE '[0-9]+' || true)
              echo "- \`node тест_мосту.js\` — ВПАЛО: **${MIST_FAILED:-0}** (рядок 2 дошки закрито; було 5 на \`main\` 18.09 — крок блокує)"
            else
              echo "- \`node тест_мосту.js\` — крок не дійшов до виводу"
            fi
            if [ -f досяжність.log ]; then
              NIKHTO=$(grep -oE '«НІХТО» = [0-9]+' досяжність.log | tail -1 | grep -oE '[0-9]+' || true)
              echo "- \`python3 досяжність.py\` — «НІХТО»: **${NIKHTO:-?}** (рядок 8 дошки закрито; було 1 на \`main\` 18.09 — крок блокує)"
            else
              echo "- \`python3 досяжність.py\` — крок не дійшов до виводу"
            fi
            if [ -f стенд.log ]; then
              ZELENYH=$(grep -cE '^  ✔' стенд.log || true)
              CHERVONYH=$(grep -cE '^  ✗' стенд.log || true)
              echo "- \`node аудит/проби/рв6_стенд.js\` — звірок: **${ZELENYH:-0} ✔ / ${CHERVONYH:-0} ✗** (Chromium + Pyodide проти зібраного index.html; крок поки не блокує)"
            else
              echo "- \`node аудит/проби/рв6_стенд.js\` — крок не дійшов до виводу"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  zbirka:
    permissions:
      contents: write
    name: зібрати показ-повний
    # ЗБІРКА ЙДЕ ЛИШЕ ПІСЛЯ ЗЕЛЕНОЇ ПЕРЕВІРКИ. Раніше вона була першою й єдиною
    # — тому й комітила артефакт зі зламаних джерел.
    needs: perevirka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Артефакт цього прогону для того самого checkout SHA; не збираємо вдруге.
      - name: перевірений показ із перевірки
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pokaz-povnyi-${{ github.sha }}
          path: .

      # Звіряємо переданий вантаж із checkout цього job до коміту артефакта.
      - name: звірка вантажу з джерелами
        working-directory: джерела
        run: python3 звірка_вантажу.py

      # СВІЖИЙ ЗВІТ ДОСЯЖНОСТІ З JOB'А `perevirka` — ЩОБ КОМІТ НИЖЧЕ НІС І ЙОГО.
      # Стоїть ПІСЛЯ звірки вантажу навмисно: тека `джерела/аудит/` у вантаж не
      # пакується (`build_артефакт.py` і `звірка_вантажу.py` її не знають), тож
      # підміна файла тут не може ні зрушити звірку, ні потрапити в `index.html`.
      # ЧОМУ БЕЗ `if: github.event_name != 'pull_request'`, хоч коміт нижче на PR
      # і не йде. Тоді цю ланку — ім'я артефакта, шлях розпакування, сам факт,
      # що `perevirka` його вивантажила — не виконував би ЖОДЕН PR, і перша її
      # перевірка була б уже на `main`, після злиття. Це рівно той клас
      # поломок, проти якого 19.09 і зроблено job `perevirka`: CI має бачити
      # те саме ДО злиття. На PR крок коштує секунди, а файл, який він кладе,
      # нікуди звідси не їде — наступний крок пропущено.
      - name: свіжий звіт досяжності з перевірки
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dosiazhnist-zvit
          path: джерела/аудит

      # Публікація лише в main: PR збирає й перевіряє продукт без коміту.
      # Артефакт і звіт належать checkout цього прогону. Якщо main уже
      # просунувся, його штатна збірка опублікує свій результат.
      - name: закомітити артефакт
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -e
          SOURCE_SHA=$(git rev-parse HEAD)
          SHTAMP=$(grep -o 'const ЗБІРКА_ПОКАЗУ = "[^"]*"' index.html | head -1 | sed 's/.*= "//; s/"$//')
          if [ "${SHTAMP}" != "${SOURCE_SHA}" ]; then
            echo "штамп ${SHTAMP} не відповідає джерелам ${SOURCE_SHA} — публікацію зупинено"
            exit 1
          fi
          printf '%s' "${SHTAMP}" > build.txt
          ZVIT="джерела/аудит/ДОСЯЖНІСТЬ.md"
          git add index.html build.txt "${ZVIT}"
          if git diff --cached --quiet; then
            echo "артефакт, штамп і звіт не змінились — коміту нема"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "збірка: ${SHTAMP}"

          # Не переносимо старий вихід на нову базу. Звичайний push має
          # батьком лише SOURCE_SHA; просування main після fetch відбиває
          # сам Git. Повтор дозволений тільки доки main лишається SOURCE_SHA.
          for sproba in 1 2 3 4 5; do
            git fetch --no-tags origin refs/heads/main
            MAIN_SHA=$(git rev-parse FETCH_HEAD)
            if [ "${MAIN_SHA}" != "${SOURCE_SHA}" ]; then
              echo "main ${MAIN_SHA} вже новіший за джерела ${SOURCE_SHA} — застарілу публікацію пропущено" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "артефакт джерел ${SOURCE_SHA} запушено зі спроби ${sproba}"
              exit 0
            fi
            echo "push відбито (спроба ${sproba}) — перед повтором звіримо SHA main"
          done
          echo "п'ять спроб push не пройшли без просування main — публікація не відбулась"
          exit 1
