# Збірка продукту з джерел (наряд Н-00-01, джерело V01) і перевірка перед нею
# (рядки 27 і 33 дошки тріажу).
#
# ЩО ЦЕ ЛАГОДИТЬ. Опублікований index.html робився руками — комітами
# «Add files via upload». Тому продукт міг відстати від джерел і мовчати про
# це: виміряно 10.09.2026, що на Pages виконувався код станом на 04.09, тоді як
# у джерелах лежало близько 35 правок, і жоден гейт цього не бачив. Збірка
# руками — це не процес, а звичка, і зникає вона разом з тим, хто її пам'ятав.
#
# ЩО ЛАГОДИТЬ JOB `perevirka` (додано 19.09.2026). До нього workflow ішов ЛИШЕ
# на `push` у `main` — тобто вперше дивився на код уже ПІСЛЯ злиття. 18.09 три
# PR (#89, #90, #95) злились у `main` без жодної перевірки, і `тест_показу.js`
# приїхав туди з незакритою дужкою після злиття: батарея показу перестала
# виконуватись, публікація продукту стояла годину. Жодна перевірка цього не
# спіймала не тому, що її не було в репозиторії, а тому, що CI її не кликав:
# у workflow були лише `build_артефакт`, `звірка_вантажу` і `jsdom`, а
# `тест_живого_шляху`, `тест_протоколу`, `тест_показу`, `досяжність` і
# `node --check` жили тільки в чужих руках. Тепер CI бачить те саме, що бачить
# ревізія, і бачить це ДО злиття — на `pull_request` у `main`.
#
# ЩО ЛИШИЛОСЬ ЗРОБИТИ РУКАМИ ВЛАСНИКУ (правилом гілки, не файлом — крок 2
# наряду): заборонити push у `main` повз цей workflow, щоб «Add files via
# upload» більше не міг перезаписати зібраний артефакт, і зробити `perevirka`
# обов'язковою перевіркою для злиття PR. Поки правила нема, ручний коміт і
# далі переможе бота — файл про це сказати не може.
name: збірка показу

on:
  # PR у `main` — головна причина існування job'а `perevirka`. Фільтра `paths`
  # тут СВІДОМО нема: рядок 27 дошки вимагає, щоб CI бачив те саме, що ревізія,
  # а зміна в `аудит/проби/` чи у workflow теж може зламати батарею.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Збірка має сенс лише коли змінилось те, з чого вона збирається. Без
    # фільтра бот-коміт «збірка: …» сам себе б і запускав — нескінченно.
    paths:
      - 'джерела/**'
      - 'каталог_повний.xml.gz'
      - '.github/workflows/zbirka.yml'
  workflow_dispatch:

permissions:
  contents: write

# ОДНА ЗБІРКА ВОДНОЧАС. `cancel-in-progress: false` — перервана посеред коміту
# збірка гірша за чергу.
# ЧОГО ЦЕ НЕ РОБИТЬ, І ЦЕ ТРЕБА СКАЗАТИ ВГОЛОС: від гонки з жнивами група тут
# не рятує. `zhnyva.yml`, `zhnyvarka.yml` і `rozvidka.yml` теж комітять у `main`,
# але кожен у ВЛАСНІЙ групі (`zhnyva`, `zhnyvarka`, `rozvidka`), а спільна група
# вимагала б правити ті три файли — вони поза межами цього наряду. Тому від
# гонки боронить не група, а `git pull --rebase` перед push у кроці коміту.
# ПРО PR: кожен PR дістає ВЛАСНУ групу (`…-refs/pull/N/merge`), інакше
# перевірки всіх відкритих PR стали б у чергу за збіркою `main` і чекали б по
# кілька хвилин на порожньому місці. Збірки `main` як стояли в одній черзі, так
# і стоять.
concurrency:
  group: збірка-показу-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # КЛЮЧ JOB'А — ASCII, І ЦЕ НЕ СТИЛЬ, А ВИМОГА GITHUB: `jobs.<job_id>` мусить
  # починатися з літери або `_` і містити лише [A-Za-z0-9_-]. Тут колись стояло
  # `зібрати`, і наслідок був не косметичний — workflow не запускався ЖОДНОГО
  # разу від дня написання: прогін створювався й умирав до першого кроку (нуль
  # job'ів, `created_at == run_started_at`), і так на КОЖНІЙ гілці, бо фільтр
  # `branches: [main]` лежить усередині файла, який не вдалося розібрати.
  # Людське ім'я живе в `name:` — воно рядок, і кирилиця там законна.
  perevirka:
    name: перевірка джерел
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: залежності батареї показу
        working-directory: джерела
        run: npm i jsdom fake-indexeddb

      # Синтаксис — перший гейт і найдешевший. САМЕ ЦЬОГО БРАКУВАЛО 18.09:
      # `тест_показу.js` з незакритою дужкою заїхав у `main`, і ніщо в CI не
      # мало права сказати «ні». `node --check` на кожен `.js` у `джерела/`
      # коштує частку секунди й ловить увесь клас поломок злиття.
      # `node_modules` відрізано: чужий код не наша відповідальність, а
      # перевірка його зайняла б хвилини.
      - name: node --check на кожен .js у джерела/
        run: |
          set -u
          fails=0
          for f in $(find джерела -name node_modules -prune -o -name '*.js' -print | sort); do
            if node --check "$f" >/dev/null 2>&1; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              node --check "$f" || true
              fails=$((fails + 1))
            fi
          done
          echo "node --check: fails $fails"
          [ "$fails" -eq 0 ]

      # Те саме для Python: компіляція без виконання. Ловить те, що злиття
      # ламає найчастіше, — відступ і дужку, — і не потребує ні каталогу, ні
      # мережі.
      - name: py_compile на кожен .py у джерела/
        run: |
          set -u
          fails=0
          for f in $(find джерела -name node_modules -prune -o -name '*.py' -print | sort); do
            python3 -m py_compile "$f" 2>/dev/null || { echo "  ✗ $f"; python3 -m py_compile "$f" || true; fails=$((fails + 1)); }
          done
          echo "py_compile: fails $fails"
          [ "$fails" -eq 0 ]

      # Каталоги потрібні всій батареї нижче: `стенд_знімок` бере
      # `каталог_повний.xml`, живий шлях і показ — `каталог_brief.xml`. Обидва
      # лежать у git лише як `.gz` (розпаковані — у .gitignore).
      - name: розпакувати каталоги й почистити фід
        run: |
          gunzip -kfc каталог_повний.xml.gz > джерела/каталог_повний.xml
          gunzip -kfc джерела/каталог_brief.xml.gz > джерела/каталог_brief.xml
          cd джерела
          python3 -c "import чистка_каталогу as ч; print(ч.почистити('каталог_повний.xml','каталог_повний.xml'))"

      - name: дим на живому шляху
        working-directory: джерела
        run: python3 стенд_знімок.py --дим

      - name: живий шлях (4 руки × 2 каталоги, brief)
        working-directory: джерела
        run: python3 тест_живого_шляху.py

      - name: протокол
        working-directory: джерела
        run: python3 тест_протоколу.py

      # Батарея показу — та сама, що впала 18.09. Обов'язкова: без
      # `continue-on-error`.
      - name: батарея показу (jsdom)
        working-directory: джерела
        env:
          NODE_PATH: node_modules
        run: node тест_показу.js

      # ДВА КРОКИ НИЖЧЕ ПОКИ НЕ ЧЕРВОНЯТЬ ПРОГІН — і це тимчасово, з названою
      # причиною. `тест_мосту.js` падає на 5 звірках (рядок 2 дошки),
      # `досяжність.py` дає «НІХТО» = 1 (рядок 8). Мовчати про них не можна,
      # але й блокувати ними злиття, поки рядки відкриті, означало б, що
      # червоний CI перестануть читати. Тому: прогін іде далі, а ЧИСЛО йде в
      # підсумок прогону, щоб зростання було видно без логів. Щойно рядки 2 і 8
      # закриються — `continue-on-error` знімається з відповідного кроку.
      - name: міст (рядок 2 дошки — поки не блокує)
        id: mist
        continue-on-error: true
        working-directory: джерела
        run: |
          set -o pipefail
          node тест_мосту.js 2>&1 | tee ../міст.log

      - name: досяжність (рядок 8 дошки — поки не блокує)
        id: dosiazhnist
        continue-on-error: true
        working-directory: джерела
        run: |
          set -o pipefail
          python3 досяжність.py 2>&1 | tee ../досяжність.log

      - name: числа двох червоних приладів у підсумок
        if: always()
        run: |
          {
            echo "### Прилади, які ще не блокують злиття"
            echo ""
            if [ -f міст.log ]; then
              MIST_FAILED=$(grep -oE 'ВПАЛО [0-9]+' міст.log | tail -1 | grep -oE '[0-9]+' || true)
              echo "- \`node тест_мосту.js\` — ВПАЛО: **${MIST_FAILED:-0}** (рядок 2 дошки; було 5 на \`main\` 18.09)"
            else
              echo "- \`node тест_мосту.js\` — крок не дійшов до виводу"
            fi
            if [ -f досяжність.log ]; then
              NIKHTO=$(grep -oE '«НІХТО» = [0-9]+' досяжність.log | tail -1 | grep -oE '[0-9]+' || true)
              echo "- \`python3 досяжність.py\` — «НІХТО»: **${NIKHTO:-?}** (рядок 8 дошки; було 1 на \`main\` 18.09)"
            else
              echo "- \`python3 досяжність.py\` — крок не дійшов до виводу"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  zbirka:
    name: зібрати показ-повний
    # ЗБІРКА ЙДЕ ЛИШЕ ПІСЛЯ ЗЕЛЕНОЇ ПЕРЕВІРКИ. Раніше вона була першою й єдиною
    # — тому й комітила артефакт зі зламаних джерел.
    needs: perevirka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # node потрібен збирачеві: `node --check` на JS сторінки — гейт 2 збірки.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # jsdom-батарея показу — гейт 5 збірки (Н-V01-003). Без неї збирач не
      # падає, а друкує попередження; у CI ми хочемо саме перевірку.
      - name: залежності батареї показу
        working-directory: джерела
        run: npm i jsdom fake-indexeddb

      # Каталог лежить у репозиторії стиснутим; чистка знімає помилки слота й
      # подвійні екранування, без яких гейт чистоти збирача відмовляє.
      - name: розпакувати каталоги й почистити фід
        run: |
          # ДВА КАТАЛОГИ, І ДРУГИЙ НЕ МЕНШ ОБОВʼЯЗКОВИЙ.
          # `каталог_повний.xml` — фід, який їде у вантаж.
          # `каталог_brief.xml` — фікстура `build_артефакт.ФІД`, яку читає ПОВНИЙ
          # ЗОНД: він кличе `bridge.виклик("запити", каталог=ФІД)` і вимірює, чи
          # виконався шлях збирання образу. Обидва лежать у git лише як `.gz`
          # (розпаковані — у .gitignore), тож на чистому клоні їх треба дістати.
          # ЧОМУ ЦЕ СТОЇТЬ ТУТ ОКРЕМИМ РЯДКОМ, А НЕ «САМО РОЗПАКУЄТЬСЯ»: без
          # фікстури зонд не падає, а тихо міряє ПОРОЖНІЙ пул — `composer` не
          # імпортується, і збірка зупиняється на «повний зонд не побачив
          # composer». Виміряно 11.09.2026 першим живим прогоном цього workflow.
          gunzip -kc каталог_повний.xml.gz > джерела/каталог_повний.xml
          gunzip -kc джерела/каталог_brief.xml.gz > джерела/каталог_brief.xml
          cd джерела
          # Чиститься лише фід вантажу: фікстура зібрана стратифікованою вибіркою
          # вже з почищеного каталогу й другої чистки не потребує.
          python3 -c "import чистка_каталогу as ч; print(ч.почистити('каталог_повний.xml','каталог_повний.xml'))"

      - name: зібрати показ-повний
        working-directory: джерела
        env:
          # Латиницею: bash не експортує кириличні імена, тож `env:` тут
          # працює лише з `LYUSTERKO_CATALOG` (див. build_артефакт.py).
          LYUSTERKO_CATALOG: повний
        run: |
          set -o pipefail
          # Штамп і лічба модулів — у підсумок прогону, щоб не лізти в логи по
          # одному рядку, заради якого прогін і робиться.
          python3 build_артефакт.py . ../index.html показ-повний 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Вантаж мусить збігатися з джерелами. Після щойно зробленої збірки це
      # тавтологія — і саме тому крок дешевий, а мовчазний розсинхрон більше
      # неможливий: код виходу 1 червонить збірку до коміту артефакта.
      - name: звірка вантажу з джерелами
        working-directory: джерела
        run: python3 звірка_вантажу.py

      # КОМІТ АРТЕФАКТА — ТІЛЬКИ НА `push` У `main`. На PR збірка виконується
      # (щоб зламаний збирач не доїхав до `main` мовчки), але нічого не комітить:
      # гілка PR не місце для зібраного продукту, а на форку `contents: write`
      # і не дали б.
      - name: закомітити артефакт
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html не змінився — коміту нема"
            exit 0
          fi
          # ІМ'Я ЗМІННОЇ — ЛАТИНИЦЕЮ, З ТІЄЇ Ж ПРИЧИНИ, ЩО Й `LYUSTERKO_CATALOG`
          # вище: bash не має кириличних імен змінних. `ШТАМП=$(...)` — це для
          # нього не присвоєння, а спроба виконати команду з такою назвою: код
          # 127, а під `set -e` крок падає. Урок уже був записаний у цьому файлі
          # для `env:` — і не застосований тут.
          SHTAMP=$(grep -o 'const ЗБІРКА_ПОКАЗУ = "[^"]*"' index.html | head -1 | sed 's/.*= "//; s/"$//')
          git add index.html
          git commit -m "збірка: ${SHTAMP}"
          # За зразком zhnyvarka.yml:129 — жнива й розвідка комітять у той самий
          # `main` зі своїх груп, тож між нашим комітом і push туди міг заїхати
          # чужий. Ребейз поверх нього, а не push силою.
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
