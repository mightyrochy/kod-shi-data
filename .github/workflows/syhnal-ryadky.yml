# Сигнал «рядок → корінь → прилад 0»: після злиття в `main` PR з рядками дошки (`аудит/дошка/<гілка>.md`) прилад
# `джерела/прилади/рядки_корінь_нуль.py` називає нові рядки, чий корінь вже має прилад кореня 0 на `main`.
# Це сигнал, а не гейт: крок не валить CI. Перелік — у підсумку прогону й анотації `::warning` (не секрет, не
# `workflow_dispatch`, не запис у репозиторій); читає його менеджер/диспетчер з прогону (`аудит/ДИСПЕТЧЕР.md`, «Пульс»).
name: сигнал рядків кореня

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: сигнал-рядків-${{ github.sha }}
  cancel-in-progress: false

jobs:
  syhnal:
    permissions:
      contents: read
    name: сигнал рядків кореня
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Базу пушу (`event.before`) беремо, якщо вона є; нема (нулі, не отримано) — перший батько голови.
      - name: рядки дошки при приладі кореня 0
        continue-on-error: true
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ -n "${BASE//0/}" ]; then
            git fetch --no-tags --depth=1 origin "${BASE}" || echo "базу ${BASE} не отримано з origin"
          fi
          python3 джерела/прилади/рядки_корінь_нуль.py --база "${BASE}"
