name: рядок ЖИВИЙ ПІСЛЯ у тілі PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: живий-рядок-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zhyvyi_ryadok:
    name: рядок ЖИВИЙ ПІСЛЯ розбирається
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Тіло PR — чужий текст: лише змінна середовища, у команду воно не підставляється.
      - name: тіло PR розбирається тим самим кодом, що й планувальник
        shell: powershell
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        # Кирилиця в аргументі -File псується у Windows PowerShell 5.1: скрипт викликається оператором & усередині кроку.
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'аудит/адаптери/gemini/перевірка/перевірити_тіло_pr.ps1') -Root $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE
