app:
  output_dir: data/outputs
  save_intermediate_artifacts: true

models:
  vision_analyzer:
    provider: ollama
    model: qwen2.5vl
  stylist_llm:
    provider: ollama
    model: qwen3
  evaluator_vlm:
    provider: ollama
    model: qwen2.5vl
  image_editor:
    provider: comfyui
    workflow: workflows/comfyui/qwen_image_edit_2511.json

comfyui:
  base_url: http://127.0.0.1:8188
  model:
    diffusion: qwen_image_edit_2511_fp8mixed.safetensors
    text_encoder: qwen_2.5_vl_7b_fp8_scaled.safetensors
    vae: qwen_image_vae.safetensors

retry:
  max_attempts: 3
  retry_on:
    - identity_failed
    - missing_required_item
    - layering_failed
    - detail_simplified

evaluation:
  minimum_score: 0.82
  require_all_items_present: true
  require_identity_preserved: true

